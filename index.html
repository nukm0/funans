<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>Финансы</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0d0f14;
  --panel: #151922;
  --panel2: #1b2029;
  --border: #242b38;
  --text: #e8ecf4;
  --muted: #8892a6;
  --accent: #4f8cff;
  --green: #22c55e;
  --red: #ef4444;
  --purple: #a06bff;
  --orange: #f59e0b;
  --radius: 14px;
}
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  overflow-x: hidden;
}
.app { max-width: 1280px; margin: 0 auto; padding: 20px; padding-bottom: env(safe-area-inset-bottom, 20px); }

/* Header */
header {
  display: flex; flex-wrap: wrap; gap: 16px;
  align-items: center; justify-content: space-between;
  padding: 14px 20px; background: var(--panel);
  border: 1px solid var(--border); border-radius: var(--radius);
  margin-bottom: 14px;
}
.brand {
  font-size: 20px; font-weight: 700; letter-spacing: -0.3px;
  cursor: pointer; user-select: none; transition: .15s;
  display: flex; align-items: center; gap: 8px;
}
.brand::before { content: '💰'; font-size: 22px; }
.brand:hover { color: var(--accent); }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button {
  background: transparent; border: 1px solid transparent; color: var(--muted);
  padding: 8px 14px; border-radius: 10px; cursor: pointer;
  font-size: 14px; font-weight: 500; transition: .15s;
  font-family: inherit;
}
nav button:hover { color: var(--text); background: var(--panel2); }
nav button.active { background: var(--accent); color: #fff; }

/* Period bar */
.period-bar {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 12px 16px; background: var(--panel);
  border: 1px solid var(--border); border-radius: var(--radius);
  margin-bottom: 14px;
}
.period-bar .label { color: var(--muted); font-size: 13px; margin-right: 4px; }
.chip {
  background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
  padding: 7px 13px; border-radius: 999px; cursor: pointer; font-size: 13px;
  transition: .15s; font-family: inherit; font-weight: 500;
}
.chip:hover { color: var(--text); }
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.period-bar .range-note { margin-left: auto; color: var(--muted); font-size: 13px; }

/* Inputs */
input, select, textarea, button { font-family: inherit; font-size: 14px; }
input[type=text], input[type=number], input[type=date], input[type=time], select, textarea {
  background: var(--panel2); border: 1px solid var(--border); color: var(--text);
  padding: 10px 12px; border-radius: 10px; outline: none; transition: .15s;
  width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }

/* Remove number spinners */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
input[type=number] {
  -moz-appearance: textfield;
  appearance: textfield;
}

/* Buttons */
.btn {
  background: var(--accent); color: #fff; border: none;
  padding: 10px 18px; border-radius: 10px; cursor: pointer;
  font-weight: 600; font-size: 14px; transition: .15s;
  font-family: inherit;
}
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: scale(.98); }
.btn.ghost { background: var(--panel2); border: 1px solid var(--border); color: var(--text); }
.btn.ghost:hover { border-color: var(--accent); }
.btn.small { padding: 7px 12px; font-size: 13px; }
.btn.danger { background: transparent; border: 1px solid var(--red); color: var(--red); }

/* Date & select triggers */
.date-trigger, .select-trigger {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 10px;
  background: var(--panel2); border: 1px solid var(--border);
  color: var(--text); cursor: pointer; font-size: 14px;
  text-align: left; transition: .15s;
  font-family: inherit;
}
.date-trigger:hover, .select-trigger:hover { border-color: var(--accent); }
.date-trigger.compact { padding: 7px 12px; font-size: 13px; width: auto; }
.dt-icon, .st-arrow { margin-left: auto; opacity: .55; font-size: 15px; }
.select-trigger .st-icon { font-size: 18px; }
.select-trigger .st-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Cards */
.grid { display: grid; gap: 14px; }
.cards-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.cards-3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.two-col { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }

.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px;
}
.card h3 {
  font-size: 13px; font-weight: 600; color: var(--muted);
  margin-bottom: 14px; text-transform: uppercase; letter-spacing: .5px;
}

.stat .label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.stat .value { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
.stat .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
.income { color: var(--green); }
.expense { color: var(--red); }
.balance-pos { color: var(--accent); }
.balance-neg { color: var(--orange); }

/* Transactions */
.tx-form { display: grid; grid-template-columns: 1fr 1fr 1.3fr 1fr 1.5fr auto; gap: 10px; align-items: end; }
.type-toggle { display: flex; gap: 6px; }
.type-toggle button {
  flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--panel2); color: var(--muted); cursor: pointer; font-weight: 600;
  transition: .15s; font-family: inherit;
}
.type-toggle button.active.inc { background: rgba(34,197,94,.15); border-color: var(--green); color: var(--green); }
.type-toggle button.active.exp { background: rgba(239,68,68,.15); border-color: var(--red); color: var(--red); }

.tx-list { display: flex; flex-direction: column; gap: 8px; }
.tx-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; background: var(--panel2);
  border: 1px solid var(--border); border-radius: 12px;
}
.tx-icon {
  width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center;
  font-size: 19px; background: var(--panel); flex-shrink: 0;
}
.tx-info { flex: 1; min-width: 0; }
.tx-info .t { font-weight: 600; font-size: 14px; }
.tx-info .d { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-amount { font-weight: 700; font-size: 15px; white-space: nowrap; }
.tx-del {
  background: transparent; border: none; color: var(--muted); cursor: pointer;
  font-size: 20px; padding: 4px 8px; border-radius: 8px; line-height: 1;
  font-family: inherit;
}
.tx-del:hover { color: var(--red); background: rgba(239,68,68,.1); }

.date-group { margin-top: 18px; }
.date-group .date-head {
  font-size: 12px; color: var(--muted); text-transform: uppercase;
  letter-spacing: .5px; margin-bottom: 8px; padding-left: 4px;
}

/* Bars */
.bar-row { margin-bottom: 14px; }
.bar-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; gap: 8px; }
.bar-top .name { color: var(--text); font-weight: 500; }
.bar-top .val { color: var(--muted); white-space: nowrap; }
.bar-bg { height: 8px; background: var(--panel2); border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 99px; transition: width .4s ease; }

/* Donut */
.donut-wrap { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.donut { width: 160px; height: 160px; border-radius: 50%; position: relative; flex-shrink: 0; }
.donut::after {
  content: ''; position: absolute; inset: 26px; background: var(--panel);
  border-radius: 50%;
}
.donut-center {
  position: absolute; inset: 0; display: grid; place-items: center;
  z-index: 2; text-align: center; pointer-events: none;
}
.donut-center .v { font-size: 16px; font-weight: 700; }
.donut-center .l { font-size: 11px; color: var(--muted); }
.legend { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 180px; }
.legend-item { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.legend-item .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend-item .v { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Daily chart */
.daily-chart {
  display: flex; align-items: flex-end; gap: 3px; height: 140px;
  padding-top: 10px; overflow-x: auto;
}
.daily-bar { flex: 1; min-width: 8px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; height: 100%; position: relative; }
.daily-bar .b { width: 100%; border-radius: 3px 3px 0 0; transition: height .3s; }
.daily-bar .b.inc { background: var(--green); }
.daily-bar .b.exp { background: var(--red); }
.daily-bar:hover::after {
  content: attr(data-tip); position: absolute; bottom: 100%; left: 50%;
  transform: translateX(-50%); background: #000; color: #fff; font-size: 11px;
  padding: 4px 8px; border-radius: 6px; white-space: nowrap; z-index: 10;
}

/* Distribution */
.dist-card { position: relative; overflow: hidden; }
.dist-card .stripe { position: absolute; top: 0; left: 0; right: 0; height: 4px; }
.dist-card .dist-name { font-weight: 700; font-size: 15px; }
.dist-card .dist-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
.dist-card .pct-input { display: flex; align-items: center; gap: 6px; margin-top: 12px; }
.dist-card .pct-input input { width: 74px; text-align: center; font-weight: 700; }
.dist-card .amount { font-size: 24px; font-weight: 700; margin-top: 12px; letter-spacing: -0.5px; }
.dist-card .actual { font-size: 12px; margin-top: 10px; color: var(--muted); line-height: 1.6; }

.card-head-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; flex-wrap: wrap; margin-bottom: 14px;
}
.card-head-row h3 { margin-bottom: 0; }
.pct-badge {
  font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
  background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
}
.pct-badge.ok { color: var(--green); border-color: rgba(34,197,94,.4); background: rgba(34,197,94,.1); }
.pct-badge.warn { color: var(--orange); border-color: rgba(245,158,11,.4); background: rgba(245,158,11,.1); }

.progress-total { height: 10px; background: var(--panel2); border-radius: 99px; overflow: hidden; display: flex; margin: 8px 0 12px; }

/* Planner */
.planner-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.planner-date { font-size: 17px; font-weight: 700; }
.task-form { display: grid; grid-template-columns: 140px 1fr auto; gap: 10px; align-items: end; }

.task-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.task {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  background: var(--panel2); border: 1px solid var(--border); border-radius: 12px;
  border-left: 3px solid var(--accent);
}
.task.done { opacity: .5; }
.task.done .task-text { text-decoration: line-through; }
.task-time {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px;
  color: var(--accent); min-width: 52px;
}
.task-text { flex: 1; font-size: 14px; word-break: break-word; }
.task-check {
  width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--border);
  background: transparent; cursor: pointer; display: grid; place-items: center;
  color: transparent; font-size: 13px; flex-shrink: 0;
  font-family: inherit;
}
.task-check:hover { border-color: var(--accent); }
.task.done .task-check { background: var(--green); border-color: var(--green); color: #fff; }

/* Empty */
.empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }
.empty .big { font-size: 40px; margin-bottom: 10px; opacity: .5; }

/* Row / misc */
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.mt { margin-top: 14px; }
.muted { color: var(--muted); font-size: 13px; }
.hidden { display: none !important; }

/* ========== POPUPS ========== */
.popup-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.7);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  display: grid; place-items: center;
  z-index: 1000;
  padding: 16px;
  animation: fadeIn .15s ease;
}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
@keyframes popIn { from { opacity: 0; transform: scale(.95) } to { opacity: 1; transform: scale(1) } }
@keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }

.popup {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  width: 100%;
  max-width: 360px;
  box-shadow: 0 24px 60px rgba(0,0,0,.6);
  animation: popIn .2s ease;
  overflow: hidden;
}

/* Calendar */
.calendar-popup { padding: 18px; }
.cal-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.cal-nav {
  width: 38px; height: 38px; border-radius: 11px;
  background: var(--panel2); border: 1px solid var(--border);
  color: var(--text); font-size: 20px; cursor: pointer;
  display: grid; place-items: center;
  transition: .15s; font-family: inherit; line-height: 1;
}
.cal-nav:hover { background: var(--border); color: var(--accent); }
.cal-title { font-weight: 700; font-size: 15px; letter-spacing: -0.2px; }

.cal-week {
  display: grid; grid-template-columns: repeat(7, 1fr);
  margin-bottom: 6px;
  color: var(--muted); font-size: 11px; text-align: center;
  text-transform: uppercase; letter-spacing: .5px; font-weight: 600;
}
.cal-week span { padding: 4px 0; }
.cal-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
}
.cal-day {
  aspect-ratio: 1; border: none; background: transparent;
  color: var(--text); font-size: 14px; cursor: pointer;
  border-radius: 10px; font-weight: 500;
  display: grid; place-items: center;
  transition: .12s; font-family: inherit;
}
.cal-day:hover { background: var(--panel2); }
.cal-day.empty { cursor: default; }
.cal-day.today { color: var(--accent); font-weight: 700; box-shadow: inset 0 0 0 1px var(--accent); }
.cal-day.selected { background: var(--accent); color: #fff; font-weight: 700; box-shadow: none; }
.cal-day.selected:hover { background: var(--accent); }

.cal-foot {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 14px; padding-top: 14px;
  border-top: 1px solid var(--border);
}

/* Select popup */
.select-popup { padding: 8px; max-height: 70vh; overflow-y: auto; }
.select-head {
  padding: 12px 14px 6px;
  font-size: 12px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .5px; font-weight: 600;
}
.sel-item {
  width: 100%; display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; background: transparent; border: none;
  color: var(--text); cursor: pointer; border-radius: 12px;
  text-align: left; font-size: 15px;
  transition: .12s; font-family: inherit;
}
.sel-item:hover { background: var(--panel2); }
.sel-item.selected { background: rgba(79,140,255,.15); color: var(--accent); font-weight: 600; }
.sel-icon { font-size: 20px; width: 28px; text-align: center; flex-shrink: 0; }
.sel-name { flex: 1; }
.sel-group-label {
  padding: 12px 14px 4px; font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .5px; font-weight: 600;
}

/* ========== MOBILE ========== */
@media (max-width: 900px) {
  .tx-form { grid-template-columns: 1fr 1fr; }
  .tx-form > *:nth-child(2) { grid-column: 2; }
}

@media (max-width: 700px) {
  .app { padding: 10px; }
  header {
    padding: 12px 14px; gap: 12px;
    flex-direction: column; align-items: stretch;
  }
  .brand { justify-content: center; font-size: 19px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  nav {
    overflow-x: auto; flex-wrap: nowrap; padding-bottom: 2px;
    scrollbar-width: none; justify-content: flex-start;
  }
  nav::-webkit-scrollbar { display: none; }
  nav button { flex-shrink: 0; padding: 8px 12px; font-size: 13px; }

  .period-bar {
    flex-wrap: nowrap; overflow-x: auto; padding: 10px 12px;
    scrollbar-width: none;
  }
  .period-bar::-webkit-scrollbar { display: none; }
  .period-bar > * { flex-shrink: 0; }
  .period-bar .range-note { display: none; }

  /* Prevent iOS zoom */
  input, select, textarea, .date-trigger, .select-trigger, .btn {
    font-size: 16px;
  }
  .btn.small { font-size: 14px; }
  .chip { font-size: 13px; }

  .cards-4 { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .cards-3 { grid-template-columns: 1fr; }
  .two-col { grid-template-columns: 1fr; }
  .stat .value { font-size: 18px; }
  .stat .label { font-size: 12px; }
  .card { padding: 15px; }
  .card h3 { font-size: 12px; margin-bottom: 12px; }

  .tx-form { grid-template-columns: 1fr !important; }
  .task-form { grid-template-columns: 1fr !important; }

  .donut-wrap { flex-direction: column; align-items: stretch; gap: 16px; }
  .donut { margin: 0 auto; }

  .planner-head { gap: 8px; }
  .planner-date { font-size: 15px; flex: 1; min-width: 0; }

  /* Bottom sheet style popups on mobile */
  .popup-overlay { padding: 0; place-items: end center; align-items: end; }
  .popup {
    max-width: 100%;
    border-radius: 22px 22px 0 0;
    max-height: 85vh;
    animation: slideUp .22s ease;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .select-popup { max-height: 80vh; }
  .cal-day { font-size: 15px; }

  .dist-card .amount { font-size: 22px; }
  .dist-card .pct-input input { font-size: 16px; }
}

@media (max-width: 380px) {
  .cards-4 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" id="brand">Финансы</div>
    <nav id="nav">
      <button data-tab="dashboard" class="active">Обзор</button>
      <button data-tab="transactions">Операции</button>
      <button data-tab="analytics">Аналитика</button>
      <button data-tab="distribution">Распределение</button>
      <button data-tab="planner">Дневник</button>
    </nav>
  </header>

  <div class="period-bar" id="periodBar"></div>
  <main id="main"></main>
</div>

<script>
/* ============================ DATA ============================ */

  ],

    { id: 'food',        name: 'Продукты',      icon: '🛒', group: 'needs' },

    { id: 'cafe',        name: 'Кафе',          icon: '☕', group: 'wants' },

    { id: 'shopping',    name: 'Покупки',       icon: '🛍️', group: 'wants' },

    { id: 'invest',      name: 'Инвестиции',    icon: '📊', group: 'savings' }
  ]

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDateLocal(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

let state = (() => {

  } catch(e) {}
  return {

};

/* ============================ UTILS ============================ */

function fmt(n) {
  return new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 }).format(n || 0);
}
function money(n) { return fmt(n) + ' ' + state.currency; }

function fmtDateHuman(iso) {
  if (!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  const t = todayStr();
  if (iso === t) return 'Сегодня';
  const yest = new Date(); yest.setDate(yest.getDate()-1);
  if (iso === fmtDateLocal(yest)) return 'Вчера';
  const tom = new Date(); tom.setDate(tom.getDate()+1);
  if (iso === fmtDateLocal(tom)) return 'Завтра';
  return `${d} ${months[m-1]} ${y}`;
}

function getRange() {
  const now = new Date();
  const t = todayStr();
  switch (ui.period) {
    case 'day': return [t, t];
    case 'week': {
      const d = new Date(now);
      const wd = (d.getDay() + 6) % 7;
      const s = new Date(d); s.setDate(d.getDate() - wd);
      const e = new Date(s); e.setDate(s.getDate() + 6);
      return [fmtDateLocal(s), fmtDateLocal(e)];
    }
    case 'month': {
      const s = new Date(now.getFullYear(), now.getMonth(), 1);
      const e = new Date(now.getFullYear(), now.getMonth()+1, 0);
      return [fmtDateLocal(s), fmtDateLocal(e)];
    }
    case 'year':
      return [`${now.getFullYear()}-01-01`, `${now.getFullYear()}-12-31`];
    case 'all': {
      if (!state.transactions.length) return [t, t];
      const ds = state.transactions.map(x => x.date).sort();
      return [ds[0], ds[ds.length-1]];
    }
    case 'custom':
      return [ui.customFrom || t, ui.customTo || t];
  }
  return [t, t];
}

function rangeLabel() {
  const [from, to] = getRange();
  if (ui.period === 'day') return fmtDateHuman(from);
  if (ui.period === 'all') return 'Всё время';
  if (from === to) return fmtDateHuman(from);
  return `${fmtDateHuman(from)} — ${fmtDateHuman(to)}`;
}

function filteredTx() {
  const [from, to] = getRange();
  return state.transactions.filter(t => t.date >= from && t.date <= to);
}

function daysBetween(from, to) {
  const a = new Date(from), b = new Date(to);
  return Math.round((b - a) / 86400000) + 1;
}

function catById(type, id) {
  return CATEGORIES[type].find(c => c.id === id) || { name: id, icon: '❓' };
}

function uid() { return Math.random().toString(36).slice(2, 10); }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================ POPUP SYSTEM ============================ */

let activePopup = null;
let activeCleanup = null;

function closePopup() {
  if (activePopup) {
    activePopup.remove();
    activePopup = null;

  if (activeCleanup) {

}

/* ============================ CALENDAR ============================ */

function getDaysInMonth(y, m) {
  return new Date(y, m + 1, 0).getDate();
}
function getFirstWeekday(y, m) {
  const d = new Date(y, m, 1).getDay();
  return (d + 6) % 7; // 0 = Пн
}

const MONTH_NAMES = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

function openCalendarPopup(initialISO, onSelect) {
  closePopup();

  const init = initialISO ? new Date(initialISO + 'T00:00:00') : new Date();
  let viewYear = init.getFullYear();
  let viewMonth = init.getMonth();
  let selected = initialISO || todayStr();

  const overlay = document.createElement('div');
  overlay.className = 'popup-overlay';
  document.body.appendChild(overlay);
  activePopup = overlay;

  const render = () => {
    const today = todayStr();
    const firstWd = getFirstWeekday(viewYear, viewMonth);
    const daysInMonth = getDaysInMonth(viewYear, viewMonth);

    let daysHTML = '';
    for (let i = 0; i < firstWd; i++) daysHTML += '<span class="cal-day empty"></span>';
    for (let day = 1; day <= daysInMonth; day++) {
      const iso = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const cls = ['cal-day'];
      if (iso === today) cls.push('today');
      if (iso === selected) cls.push('selected');
      daysHTML += `<button type="button" class="${cls.join(' ')}" data-day="${iso}">${day}</button>`;
    }

    overlay.innerHTML = `
      <div class="popup calendar-popup">
        <div class="cal-head">
          <button type="button" class="cal-nav" data-nav="-1">‹</button>
          <div class="cal-title">${MONTH_NAMES[viewMonth]} ${viewYear}</div>
          <button type="button" class="cal-nav" data-nav="1">›</button>
        </div>
        <div class="cal-week">
          <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
        </div>
        <div class="cal-grid">${daysHTML}</div>
        <div class="cal-foot">
          <button type="button" class="btn ghost small" data-cal-clear>Отмена</button>
          <button type="button" class="btn small" data-cal-today>Сегодня</button>
        </div>
      </div>
    `;
  };

  overlay.addEventListener('click', e => {
    if (e.target === overlay) { closePopup(); return; }

    const nav = e.target.closest('[data-nav]');
    if (nav) {
      viewMonth += parseInt(nav.dataset.nav);
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      render();
      return;
    }

    const day = e.target.closest('[data-day]');
    if (day) {
      selected = day.dataset.day;
      onSelect(selected);
      closePopup();
      return;
    }

    if (e.target.closest('[data-cal-today]')) {
      onSelect(todayStr());
      closePopup();
      return;
    }

    if (e.target.closest('[data-cal-clear]')) {
      closePopup();
    }
  });

  render();
}

/* ============================ CUSTOM SELECT ============================ */

function openSelectPopup(title, options, selectedId, onSelect) {
  closePopup();

  const overlay = document.createElement('div');
  overlay.className = 'popup-overlay';
  document.body.appendChild(overlay);
  activePopup = overlay;

  // Группировка опций по group (если есть)
  const hasGroups = options.some(o => o.group);
  let html = `<div class="select-head">${escapeHtml(title)}</div>`;

  if (hasGroups) {
    const order = ['needs', 'debts', 'wants', 'savings'];
    order.forEach(g => {
      const items = options.filter(o => o.group === g);
      if (!items.length) return;
      html += `<div class="sel-group-label">${GROUPS[g].name}</div>`;
      html += items.map(o => `
        <button type="button" class="sel-item ${o.id === selectedId ? 'selected' : ''}" data-sel="${o.id}">
          <span class="sel-icon">${o.icon}</span>
          <span class="sel-name">${escapeHtml(o.name)}</span>
        </button>
      `).join('');
    });
  } else {
    html += options.map(o => `
      <button type="button" class="sel-item ${o.id === selectedId ? 'selected' : ''}" data-sel="${o.id}">
        <span class="sel-icon">${o.icon}</span>
        <span class="sel-name">${escapeHtml(o.name)}</span>
      </button>
    `).join('');
  }

  overlay.innerHTML = `<div class="popup select-popup">${html}</div>`;

  overlay.addEventListener('click', e => {
    if (e.target === overlay) { closePopup(); return; }
    const item = e.target.closest('[data-sel]');
    if (item) {
      onSelect(item.dataset.sel);
      closePopup();
    }
  });
}

/* ============================ RENDER: ANALYTICS ============================ */

function buildDonut(items) {
  const total = items.reduce((s,i) => s + i.value, 0);
  if (!total) return 'var(--panel2)';
  let acc = 0;
  const stops = items.map(i => {
    const start = acc / total * 100;
    acc += i.value;
    const end = acc / total * 100;
    return `${i.color} ${start}% ${end}%`;
  });
  return `conic-gradient(${stops.join(',')})`;
}

function buildDailyChart(tx) {
  const [from, to] = getRange();
  const days = daysBetween(from, to);
  const mode = days > 62 ? 'month' : 'day';

  const map = {};

  if (mode === 'day') {
    for (let i = 0; i < days; i++) {
      const d = new Date(from); d.setDate(d.getDate() + i);
      const k = fmtDateLocal(d);
      map[k] = { inc: 0, exp: 0, label: `${d.getDate()}.${String(d.getMonth()+1).padStart(2,'0')}` };
    }
  } else {
    const start = new Date(from);
    const end = new Date(to);
    const cur = new Date(start.getFullYear(), start.getMonth(), 1);
    while (cur <= end) {
      const k = `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}`;
      map[k] = { inc: 0, exp: 0, label: `${cur.getMonth()+1}.${String(cur.getFullYear()).slice(2)}` };
      cur.setMonth(cur.getMonth() + 1);
    }
  }

  tx.forEach(t => {
    const k = mode === 'day' ? t.date : t.date.slice(0, 7);
    if (!map[k]) return;
    if (t.type === 'income') map[k].inc += t.amount;
    else map[k].exp += t.amount;
  });

  const entries = Object.entries(map);
  const maxVal = Math.max(1, ...entries.map(([,v]) => Math.max(v.inc, v.exp)));
  const bars = entries.map(([k, v]) => ({
    label: v.label,
    inc: v.inc, exp: v.exp,
    incH: v.inc / maxVal * 100,
    expH: v.exp / maxVal * 100
  }));

  return { mode, bars };
}

          <div class="legend">
            ${incList.map(([id, val], i) => {
              const c = catById('income', id);
              const pct = Math.round(val / income * 100);
              return `<div class="legend-item">
                <span class="legend-dot" style="background:${palette[i % palette.length]}"></span>
                <span class="n">${c.icon} ${escapeHtml(c.name)}</span>
                <span class="v">${pct}% · ${money(val)}</span>
              </div>`;
            }).join('')}
          </div>
        </div>
      ` : `<div class="empty"><div class="big">💼</div>Нет данных о доходах</div>`}
    </div>
  </div>

  <div class="card mt">
    <h3>Динамика по ${chart.mode === 'month' ? 'месяцам' : 'дням'}</h3>
    <div class="daily-chart">
      ${chart.bars.map(b => `
        <div class="daily-bar" data-tip="${b.label}: +${fmt(b.inc)} / −${fmt(b.exp)}">
          ${b.inc > 0 ? `<div class="b inc" style="height:${b.incH}%"></div>` : ''}
          ${b.exp > 0 ? `<div class="b exp" style="height:${b.expH}%"></div>` : ''}
          ${b.inc === 0 && b.exp === 0 ? `<div class="b" style="height:2px;background:var(--border)"></div>` : ''}
        </div>
      `).join('')}
    </div>
    <div class="row mt" style="gap:16px">
      <span class="muted"><span class="legend-dot" style="display:inline-block;background:var(--green)"></span> Доход</span>
      <span class="muted"><span class="legend-dot" style="display:inline-block;background:var(--red)"></span> Расход</span>
    </div>
  </div>

  <div class="card mt">
    <h3>Расходы по группам</h3>
    ${Object.keys(GROUPS).map(g => {
      const val = groupTotals[g];
      const pct = expense > 0 ? Math.round(val / expense * 100) : 0;
      return `
        <div class="bar-row">
          <div class="bar-top">
            <span class="name">${GROUPS[g].name}</span>
            <span class="val">${pct}% · ${money(val)}</span>
          </div>
          <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${GROUPS[g].color}"></div></div>
        </div>`;
    }).join('')}
  </div>

  <div class="card mt">
    <h3>Топ категорий расходов</h3>
    ${expList.length ? expList.slice(0, 10).map(([id, val], i) => {
      const c = catById('expense', id);
      const pct = Math.round(val / expList[0][1] * 100);
      return `
        <div class="bar-row">
          <div class="bar-top">
            <span class="name">${c.icon} ${escapeHtml(c.name)}</span>
            <span class="val">${money(val)}</span>
          </div>
          <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${palette[i % palette.length]}"></div></div>
        </div>`;
    }).join('') : `<div class="empty">Нет данных</div>`}
  </div>
  `;
}

/* ============================ RENDER: DISTRIBUTION ============================ */

function calcDistribution(baseIncome) {
  const base = ui.distBase !== null ? ui.distBase : baseIncome;
  const d = state.distribution;
  const out = { base };
  ['needs','wants','savings','debts'].forEach(g => {
    out[g] = { pct: d[g], plan: base * d[g] / 100 };
  });
  return out;
}

function renderDistribution() {
  const tx = filteredTx();
  const periodIncome = tx.filter(t => t.type === 'income').reduce((s,t) => s + t.amount, 0);
  const dist = calcDistribution(periodIncome);
  const totalPct = state.distribution.needs + state.distribution.wants + state.distribution.savings + state.distribution.debts;

  const actual = { needs: 0, wants: 0, savings: 0, debts: 0 };
  tx.filter(t => t.type === 'expense').forEach(t => {
    const c = CATEGORIES.expense.find(x => x.id === t.category);
    if (c) actual[c.group] += t.amount;
  });

  return `
  <div class="card">
    <h3>Доход для распределения</h3>
    <div class="row">
      <input type="number" id="distBase" value="${Math.round(dist.base)}" style="max-width:220px" step="100" inputmode="numeric" placeholder="0">
      <button type="button" class="btn ghost small" id="distAuto">Взять доход за период (${money(periodIncome)})</button>
    </div>
    <div class="muted mt" style="font-size:13px">
      ${ui.distBase === null ? 'Значение берётся автоматически из доходов за выбранный период.' : 'Используется ручное значение. Нажмите «Взять доход за период», чтобы вернуть авто.'}
    </div>
  </div>

  <div class="card mt">
    <div class="card-head-row">
      <h3>Проценты распределения</h3>
      <span class="pct-badge ${totalPct === 100 ? 'ok' : 'warn'}">Сумма: ${totalPct}%</span>
    </div>
    <div class="progress-total">
      ${Object.keys(GROUPS).map(g => {
        const p = state.distribution[g];
        return `<div style="width:${p}%;background:${GROUPS[g].color}"></div>`;
      }).join('')}
    </div>

    <div class="grid cards-3 mt">
      ${Object.keys(GROUPS).map(g => {
        const pct = state.distribution[g];
        const plan = dist.base * pct / 100;
        const fact = actual[g];
        const diff = fact - plan;
        return `
        <div class="dist-card card" style="background:var(--panel2);border-color:${GROUPS[g].color}33">
          <div class="stripe" style="background:${GROUPS[g].color}"></div>
          <div class="dist-name" style="color:${GROUPS[g].color}">${GROUPS[g].name}</div>
          <div class="dist-desc">${GROUPS[g].desc}</div>

          <div class="pct-input">
            <input type="number" min="0" max="100" value="${pct}" data-dist-input="${g}" inputmode="numeric">
            <span class="muted">%</span>
          </div>

          <div class="amount" style="color:${GROUPS[g].color}">${money(plan)}</div>
          <div class="actual">
            Потрачено: <b>${money(fact)}</b><br>
            <span style="color:${diff > 0 ? 'var(--red)' : 'var(--green)'}">
              ${diff > 0 ? '▲ перерасход ' + money(diff) : '▼ остаток ' + money(-diff)}
            </span>
          </div>

          <div class="bar-bg" style="margin-top:12px">
            <div class="bar-fill" style="width:${plan > 0 ? Math.min(100, fact/plan*100) : 0}%;background:${GROUPS[g].color}"></div>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>

  <div class="card mt">
    <h3>Как это работает</h3>
    <div class="muted" style="line-height:1.8;font-size:14px">
      <b style="color:var(--accent)">Обязательное</b> — то, без чего не прожить: жильё, еда, транспорт, здоровье.<br>
      <b style="color:var(--accent)">Развлечения</b> — кафе, кино, покупки, поездки.<br>
      <b style="color:var(--accent)">Сбережения</b> — то, что откладываем или инвестируем.<br>
      <b style="color:var(--accent)">Долги</b> — МФО, кредиты и займы у близких.<br><br>
      Начните с правила <b>40/20/20/20</b> и корректируйте проценты под свою ситуацию.
      Сравнивайте «план» и «потрачено», чтобы видеть, где вы выходите за рамки.
    </div>
    <div class="row mt">
      <button type="button" class="btn ghost small" id="preset1">40 / 20 / 20 / 20 · баланс</button>
      <button type="button" class="btn ghost small" id="preset2">50 / 20 / 20 / 10 · фокус на обязательное</button>
      <button type="button" class="btn ghost small" id="preset3">35 / 15 / 30 / 20 · фокус на сбережения</button>
    </div>
  </div>
  `;
}

/* ============================ RENDER: PLANNER ============================ */

function taskHTML(t, date) {
  return `
  <div class="task ${t.done ? 'done' : ''}">
    <button type="button" class="task-check" data-task-toggle="${date}|${t.id}">✓</button>
    <div class="task-time">${t.time}</div>
    <div class="task-text">${escapeHtml(t.text)}</div>
    <button type="button" class="tx-del" data-task-del="${date}|${t.id}" title="Удалить">×</button>
  </div>`;
}

function renderPlanner() {
  const date = ui.plannerDate;
  const tasks = (state.planner[date] || []).slice().sort((a,b) => a.time.localeCompare(b.time));
  const done = tasks.filter(t => t.done).length;

  const d = new Date(date + 'T00:00:00');
  const weekdays = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
  const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const title = `${weekdays[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`;

  return `
  <div class="card">
    <div class="planner-head">
      <button type="button" class="btn ghost small" data-planner-shift="-1">‹</button>
      <div class="planner-date">${title}</div>
      <button type="button" class="btn ghost small" data-planner-shift="1">›</button>
      <button type="button" class="btn ghost small" data-planner-today>Сегодня</button>
      <button type="button" class="date-trigger compact" data-date-for="plannerDate" data-date-value="${date}">
        <span class="dt-text">${fmtDateHuman(date)}</span>
        <span class="dt-icon">📅</span>
      </button>
    </div>

    <form id="taskForm" class="task-form">
      <div>
        <label>Время</label>
        <input type="time" id="taskTime" required value="09:00">
      </div>
      <div>
        <label>Что делаем</label>
        <input type="text" id="taskText" placeholder="Например: встреча с командой" required maxlength="120">
      </div>
      <button class="btn" type="submit">Добавить</button>
    </form>
  </div>

  <div class="card mt">
    <h3>План на день ${tasks.length ? `· выполнено ${done} из ${tasks.length}` : ''}</h3>
    ${tasks.length ? `<div class="task-list">${tasks.map(t => taskHTML(t, date)).join('')}</div>`
      : `<div class="empty"><div class="big">🗓️</div>На этот день пока ничего не запланировано</div>`}
  </div>

  ${renderUpcoming()}
  `;
}

function renderUpcoming() {
  const today = todayStr();
  const items = [];
  Object.keys(state.planner).forEach(date => {
    if (date < today) return;
    if (date === ui.plannerDate) return;
    const tasks = state.planner[date] || [];
    tasks.forEach(t => { if (!t.done) items.push({ date, ...t }); });
  });
  items.sort((a,b) => (a.date + a.time).localeCompare(b.date + b.time));
  const top = items.slice(0, 6);

  return `
  <div class="card mt">
    <h3>Ближайшие задачи</h3>
    ${top.length ? `<div class="task-list">
      ${top.map(t => `
        <div class="task" data-goto-date="${t.date}" style="cursor:pointer">
          <div class="task-time">${t.time}</div>
          <div class="task-text">${escapeHtml(t.text)}</div>
          <div class="muted" style="font-size:12px;white-space:nowrap">${fmtDateHuman(t.date)}</div>
        </div>`).join('')}
    </div>` : `<div class="empty">Других запланированных задач нет</div>`}
  </div>`;
}

/* ============================ MAIN RENDER ============================ */

function render() {
  document.querySelectorAll('#nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === ui.tab);
  });

  document.getElementById('periodBar').classList.toggle('hidden', ui.tab === 'planner');
  if (ui.tab !== 'planner') renderPeriodBar();

  const main = document.getElementById('main');
  if (ui.tab === 'dashboard') main.innerHTML = renderDashboard();
  else if (ui.tab === 'transactions') main.innerHTML = renderTransactions();
  else if (ui.tab === 'analytics') main.innerHTML = renderAnalytics();
  else if (ui.tab === 'distribution') main.innerHTML = renderDistribution();
  else if (ui.tab === 'planner') main.innerHTML = renderPlanner();

  attachHandlers();
}

/* ============================ HANDLERS ============================ */

function updateCatTrigger() {
  const trigger = document.querySelector('[data-select-for="txCat"]');
  if (!trigger) return;
  const cat = catById(ui.txType, ui.txCat);
  trigger.querySelector('.st-icon').textContent = cat.icon;
  trigger.querySelector('.st-text').textContent = cat.name;
  trigger.dataset.selectValue = ui.txCat;
}

function attachHandlers() {
  // ---- distribution inline inputs
  document.querySelectorAll('[data-dist-input]').forEach(inp => {
    inp.addEventListener('input', () => {
      const g = inp.dataset.distInput;
      const v = Math.max(0, Math.min(100, parseInt(inp.value) || 0));
      state.distribution[g] = v;
      save();
      refreshDistributionNumbers();
    });
    inp.addEventListener('blur', () => render());
  });

  const distBaseInput = document.getElementById('distBase');
  if (distBaseInput) {
    distBaseInput.addEventListener('input', () => {
      ui.distBase = parseFloat(distBaseInput.value) || 0;
      refreshDistributionNumbers();
    });
  }
}

function refreshDistributionNumbers() {
  const tx = filteredTx();
  const periodIncome = tx.filter(t => t.type === 'income').reduce((s,t) => s + t.amount, 0);
  const dist = calcDistribution(periodIncome);

  document.querySelectorAll('[data-dist-input]').forEach(inp => {
    const g = inp.dataset.distInput;
    const card = inp.closest('.dist-card');
    if (!card) return;
    const amtEl = card.querySelector('.amount');
    if (amtEl) amtEl.textContent = money(dist[g].plan);

    const actual = tx.filter(t => t.type === 'expense').filter(t => {
      const c = CATEGORIES.expense.find(x => x.id === t.category);
      return c && c.group === g;
    }).reduce((s,t) => s + t.amount, 0);

    const plan = dist[g].plan;
    const diff = actual - plan;
    const actualEl = card.querySelector('.actual');
    if (actualEl) {
      actualEl.innerHTML = `Потрачено: <b>${money(actual)}</b><br>
        <span style="color:${diff > 0 ? 'var(--red)' : 'var(--green)'}">
          ${diff > 0 ? '▲ перерасход ' + money(diff) : '▼ остаток ' + money(-diff)}
        </span>`;
    }

    const barEl = card.querySelector('.bar-fill');
    if (barEl) barEl.style.width = (plan > 0 ? Math.min(100, actual/plan*100) : 0) + '%';
  });

  // обновить прогресс-бар и бейдж суммы
  const totalPct = state.distribution.needs + state.distribution.wants + state.distribution.savings + state.distribution.debts;
  const progTotal = document.querySelector('.progress-total');
  if (progTotal) {
    progTotal.innerHTML = Object.keys(GROUPS).map(g =>
      `<div style="width:${state.distribution[g]}%;background:${GROUPS[g].color}"></div>`
    ).join('');
  }
  const badge = document.querySelector('.pct-badge');
  if (badge) {
    badge.textContent = `Сумма: ${totalPct}%`;
    badge.className = `pct-badge ${totalPct === 100 ? 'ok' : 'warn'}`;
  }
}

/* ============================ GLOBAL EVENTS ============================ */

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePopup();
});

document.addEventListener('click', e => {
  // ---- brand → dashboard
  if (e.target.closest('#brand')) {
    ui.tab = 'dashboard';
    render();
    return;
  }

  // ---- nav tabs
  const navBtn = e.target.closest('#nav button');
  if (navBtn) {
    ui.tab = navBtn.dataset.tab;
    closePopup();
    render();
    return;
  }

  // ---- period chips
  const chip = e.target.closest('[data-period]');
  if (chip) {
    ui.period = chip.dataset.period;
    if (ui.period === 'custom') {
      if (!ui.customFrom) ui.customFrom = todayStr();
      if (!ui.customTo) ui.customTo = todayStr();
    }
    render();
    return;
  }

  // ---- date triggers
  const dateTrig = e.target.closest('[data-date-for]');
  if (dateTrig) {
    const key = dateTrig.dataset.dateFor;
    const current = dateTrig.dataset.dateValue || todayStr();
    openCalendarPopup(current, v => {
      if (key === 'periodFrom') {
        ui.customFrom = v;
        render();
      } else if (key === 'periodTo') {
        ui.customTo = v;
        render();
      } else if (key === 'plannerDate') {
        ui.plannerDate = v;
        render();
      } else {
        dateTrig.dataset.dateValue = v;
        dateTrig.querySelector('.dt-text').textContent = fmtDateHuman(v);
      }
    });
    return;
  }

  // ---- select triggers
  const selTrig = e.target.closest('[data-select-for]');
  if (selTrig && selTrig.dataset.selectFor === 'txCat') {
    const cats = CATEGORIES[ui.txType];
    openSelectPopup('Категория', cats, ui.txCat, v => {
      ui.txCat = v;
      updateCatTrigger();
    });
    return;
  }

  // ---- type toggle
  const typeBtn = e.target.closest('#typeToggle button');
  if (typeBtn) {
    const newType = typeBtn.dataset.type;
    if (newType === ui.txType) return;
    ui.txType = newType;
    ui.txCat = CATEGORIES[newType][0].id;

    document.querySelectorAll('#typeToggle button').forEach(b => {
      if (b.dataset.type === 'income') b.className = newType === 'income' ? 'active inc' : '';
      if (b.dataset.type === 'expense') b.className = newType === 'expense' ? 'active exp' : '';
    });
    updateCatTrigger();
    return;
  }

  // ---- submit transaction
  const txForm = e.target.closest('#txForm');
  // handled in submit, not click

  // ---- delete transaction
  const delTx = e.target.closest('[data-del-tx]');
  if (delTx) {
    const id = delTx.dataset.delTx;
    state.transactions = state.transactions.filter(t => t.id !== id);
    save(); render(); return;
  }

  // ---- toggle task
  const toggle = e.target.closest('[data-task-toggle]');
  if (toggle) {
    const [date, id] = toggle.dataset.taskToggle.split('|');
    const t = (state.planner[date] || []).find(x => x.id === id);
    if (t) { t.done = !t.done; save(); render(); }
    return;
  }

  // ---- delete task
  const delTask = e.target.closest('[data-task-del]');
  if (delTask) {
    const [date, id] = delTask.dataset.taskDel.split('|');
    state.planner[date] = (state.planner[date] || []).filter(x => x.id !== id);
    if (!state.planner[date].length) delete state.planner[date];
    save(); render(); return;
  }

  // ---- goto date from upcoming
  const goto = e.target.closest('[data-goto-date]');
  if (goto) {
    ui.plannerDate = goto.dataset.gotoDate;
    render(); return;
  }

  // ---- planner shifts
  const shift = e.target.closest('[data-planner-shift]');
  if (shift) {
    const d = new Date(ui.plannerDate + 'T00:00:00');
    d.setDate(d.getDate() + parseInt(shift.dataset.plannerShift));
    ui.plannerDate = fmtDateLocal(d);
    render(); return;
  }
  if (e.target.closest('[data-planner-today]')) {
    ui.plannerDate = todayStr();
    render(); return;
  }

  // ---- distribution presets
  if (e.target.closest('#distAuto')) {
    ui.distBase = null;
    render(); return;
  }
  if (e.target.closest('#preset1')) {
    state.distribution = { needs: 40, wants: 20, savings: 20, debts: 20 };
    save(); render(); return;
  }
  if (e.target.closest('#preset2')) {
    state.distribution = { needs: 50, wants: 20, savings: 20, debts: 10 };
    save(); render(); return;
  }
  if (e.target.closest('#preset3')) {
    state.distribution = { needs: 35, wants: 15, savings: 30, debts: 20 };
    save(); render(); return;
  }
});

// ---- form submissions
document.addEventListener('submit', e => {
  // transaction form
  if (e.target.id === 'txForm') {
    e.preventDefault();
    const amount = parseFloat(document.getElementById('txAmount').value);
    if (!amount || amount <= 0) return;

    const dateTrig = document.querySelector('[data-date-for="txDate"]');
    const date = dateTrig ? dateTrig.dataset.dateValue : todayStr();

    state.transactions.push({
      id: uid(),
      type: ui.txType,
      amount,
      category: ui.txCat,
      date,
      note: document.getElementById('txNote').value.trim()
    });
    save();
    render();
    return;
  }

  // task form
  if (e.target.id === 'taskForm') {
    e.preventDefault();
    const time = document.getElementById('taskTime').value;
    const text = document.getElementById('taskText').value.trim();
    if (!time || !text) return;
    const d = ui.plannerDate;
    if (!state.planner[d]) state.planner[d] = [];
    state.planner[d].push({ id: uid(), time, text, done: false });
    save();
    render();
    return;
  }
});

/* ============================ INIT ============================ */

render();
</script>
</body>
</html>
