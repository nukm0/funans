      Применить рекомендованное распределение
    </button>
    ` : ''}
  </div>
  `;
}

/* ============================ RENDER: DEBTS ============================ */

function renderDebts() {
  const debts = state.debts;
  const active = debts.filter(d => (d.paid || 0) < d.amount);
  const closed = debts.filter(d => (d.paid || 0) >= d.amount);
  const totalActive = active.reduce((s,d) => s + (d.amount - (d.paid || 0)), 0);

  return `
  <div class="card">
    <h3>Новый долг</h3>
    <form id="debtForm" class="tx-form" style="grid-template-columns: 1.4fr 1fr 1fr auto;">
      <div>
        <label>Кому / название</label>
        <input type="text" id="debtName" placeholder="Например: Займ у Ивана" required maxlength="80">
      </div>
      <div>
        <label>Тип</label>
        <button type="button" class="select-trigger" data-select-for="debtType" data-select-value="mfo">
          <span class="st-icon">🏪</span>
          <span class="st-text">МФО</span>
          <span class="st-arrow">▾</span>
        </button>
      </div>
      <div>
        <label>Сумма, ${state.currency}</label>
        <input type="number" id="debtAmount" step="100" min="1" inputmode="numeric" placeholder="0" required>
      </div>
      <button class="btn" type="submit">Добавить</button>
    </form>
    ${totalActive > 0 ? `<div class="muted mt">💡 Активных долгов на <b style="color:var(--red)">${money(totalActive)}</b></div>` : ''}
  </div>

  <div class="card mt">
    <h3>Активные долги · ${active.length}</h3>
    ${active.length ? active.map(d => renderDebtCard(d)).join('')
      : `<div class="empty"><div class="big">✨</div>Активных долгов нет</div>`}
  </div>

  ${closed.length ? `
  <div class="card mt">
    <h3>Закрытые · ${closed.length}</h3>
    ${closed.map(d => renderDebtCard(d, true)).join('')}
  </div>
  ` : ''}
  `;
}

function renderDebtCard(debt, isClosed = false) {
  const paid = debt.paid || 0;
  const pct = debt.amount > 0 ? Math.min(100, Math.round(paid / debt.amount * 100)) : 0;
  const type = DEBT_TYPES[debt.type] || DEBT_TYPES.other;

  return `
  <div class="debt-card" style="${isClosed ? 'opacity:.6' : ''}">
    <div class="debt-head">
      <div class="debt-info">
        <div class="debt-name">${escapeHtml(debt.name)}</div>
        <div class="debt-type">${type.icon} ${type.name}</div>
        <div class="debt-amount" style="color:${isClosed ? 'var(--green)' : 'var(--red)'}">${money(debt.amount)}</div>
      </div>
      <button type="button" class="debt-del" data-debt-del="${debt.id}" title="Удалить">×</button>
    </div>
    <div class="debt-progress">
      <div class="debt-progress-fill" style="width:${pct}%;background:${isClosed ? 'var(--green)' : 'var(--red)'}"></div>
    </div>
    <div class="debt-detail">
      <span>Выплачено <b>${money(paid)}</b> из <b>${money(debt.amount)}</b></span>
      <span>${pct}%${isClosed ? ' · закрыт ✓' : ''}</span>
    </div>
    ${!isClosed ? `
    <form class="plan-add-form" data-debt-add="${debt.id}" style="margin-top:10px">
      <input type="number" step="100" min="1" inputmode="numeric" placeholder="Сумма платежа, ${state.currency}">
      <button type="submit" class="btn small">Оплатить</button>
    </form>
    ` : ''}
  </div>
  `;
}

/* ============================ RENDER: PLANNER ============================ */

function taskHTML(t, date) {
  return `
  <div class="task ${t.done ? 'done' : ''}">
    <button type="button" class="task-check" data-task-toggle="${date}|${t.id}">✓</button>
    <div class="task-time">${t.time}</div>
    <div class="task-text">${escapeHtml(t.text)}</div>
    <button type="button" class="tx-del" data-task-del="${date}|${t.id}" title="Удалить">×</button>
  </div>`;
}

function renderPlanner() {
  const date = ui.plannerDate;
  const tasks = (state.planner[date] || []).slice().sort((a,b) => a.time.localeCompare(b.time));
  const done = tasks.filter(t => t.done).length;

  const [y,m,d] = date.split('-').map(Number);
  const title = `${WEEKDAYS_FULL[new Date(y,m-1,d).getDay()]}, ${d} ${MONTHS_FULL[m-1].toLowerCase()}`;

  return `
  <div class="card">
    <div class="planner-head">
      <button type="button" class="btn ghost small" data-planner-shift="-1">‹</button>
      <div class="planner-date">${title}</div>
      <button type="button" class="btn ghost small" data-planner-shift="1">›</button>
      <button type="button" class="btn ghost small" data-planner-today>Сегодня</button>
      <button type="button" class="date-trigger compact" data-date-for="plannerDate" data-date-value="${date}">
        <span class="dt-text">${fmtDateHuman(date)}</span>
        <span class="dt-icon">📅</span>
      </button>
      <button type="button" class="btn ghost small" data-day-view="${date}">Аналитика дня</button>
    </div>

    <form id="taskForm" class="task-form">
      <div>
        <label>Время</label>
        <button type="button" class="time-trigger" data-time-for="taskTime" data-time-value="09:00">
          <span class="tt-text">09:00</span>
          <span class="tt-icon">⏱</span>
        </button>
      </div>
      <div>
        <label>Что делаем</label>
        <input type="text" id="taskText" placeholder="Например: встреча с командой" required maxlength="120">
      </div>
      <button class="btn" type="submit">Добавить</button>
    </form>
  </div>

  <div class="card mt">
    <h3>План на день ${tasks.length ? `· выполнено ${done} из ${tasks.length}` : ''}</h3>
    ${tasks.length ? `<div class="task-list">${tasks.map(t => taskHTML(t, date)).join('')}</div>`
      : `<div class="empty"><div class="big">🗓️</div>На этот день пока ничего не запланировано</div>`}
  </div>

  ${renderUpcoming()}
  `;
}

function renderUpcoming() {
  const today = todayStr();
  const items = [];
  Object.keys(state.planner).forEach(date => {
    if (date < today) return;
    if (date === ui.plannerDate) return;
    const tasks = state.planner[date] || [];
    tasks.forEach(t => { if (!t.done) items.push({ date, ...t }); });
  });
  items.sort((a,b) => (a.date + a.time).localeCompare(b.date + b.time));
  const top = items.slice(0, 6);

  return `
  <div class="card mt">
    <h3>Ближайшие задачи</h3>
    ${top.length ? `<div class="task-list">
      ${top.map(t => `
        <div class="task" data-goto-date="${t.date}" style="cursor:pointer">
          <div class="task-time">${t.time}</div>
          <div class="task-text">${escapeHtml(t.text)}</div>
          <div class="muted" style="font-size:12px;white-space:nowrap">${fmtDateHuman(t.date)}</div>
        </div>`).join('')}
    </div>` : `<div class="empty">Других запланированных задач нет</div>`}
  </div>`;
}

/* ============================ DAY ANALYTICS MODAL ============================ */

function openDayAnalytics(iso) {
  closePopup();
  const a = analyzeDay(iso);

  const overlay = document.createElement('div');
  overlay.className = 'popup-overlay';
  document.body.appendChild(overlay);
  activePopup = overlay;

  const hasContent = a.dayTx.length || (state.planner[iso] || []).length || a.overDistribution.length || a.brokenPlans.length;

  let bodyHTML = '';

  // 1. Статус
  if (a.status === 'bad') {
    bodyHTML += `<div class="day-section">
      <div class="day-section-title">Статус дня</div>
      <span class="day-badge bad">⚠️ Есть нарушения</span>
    </div>`;
  } else if (a.status === 'ok') {
    bodyHTML += `<div class="day-section">
      <div class="day-section-title">Статус дня</div>
      <span class="day-badge ok">✓ Чисто, без нарушений</span>
    </div>`;
  }

  // 2. Выход за распределение
  if (a.overDistribution.length) {
    bodyHTML += `<div class="day-section">
      <div class="day-section-title">📊 Выход за распределение</div>
      ${a.overDistribution.map(o => `
        <div class="alert-item critical" style="margin-bottom:6px">
          <div class="alert-icon">${GROUPS[o.group].color ? '⚠️' : '⚠️'}</div>
          <div class="alert-body">
            <div class="alert-title">${GROUPS[o.group].name}</div>
            <div class="alert-desc">Потрачено ${money(o.spent)} при дневной норме ${money(o.norm)}. Перерасход: <b style="color:var(--red)">${money(o.over)}</b></div>
          </div>
        </div>
      `).join('')}
    </div>`;
  }

  // 3. Незавершённые задачи
  if (a.unfinishedTasks.length) {
    bodyHTML += `<div class="day-section">
      <div class="day-section-title">📝 Не выполнено в дневнике (${a.unfinishedTasks.length})</div>
      ${a.unfinishedTasks.map(t => `
        <div class="mini-tx">
          <span class="mini-tx-icon">⏱</span>
          <div class="mini-tx-info">
            <div class="mini-tx-name">${escapeHtml(t.text)}</div>
            <div class="mini-tx-note">запланировано на ${t.time}</div>
          </div>
        </div>
      `).join('')}
    </div>`;
  }

  // 4. Невыполненные планы
  if (a.brokenPlans.length) {
    bodyHTML += `<div class="day-section">
      <div class="day-section-title">🎯 Не выполнен план</div>
      ${a.brokenPlans.map(bp => `
        <div class="alert-item critical">
          <div class="alert-icon">🎯</div>
          <div class="alert-body">
            <div class="alert-title">${escapeHtml(bp.plan.title)}</div>
            <div class="alert-desc">Прогресс ${bp.pct}% · дедлайн был ${fmtDateHuman(bp.plan.endDate)}</div>
          </div>
        </div>
      `).join('')}
    </div>`;
  }

  // 5. Транзакции
  if (a.dayTx.length) {
    bodyHTML += `<div class="day-section">
      <div class="day-section-title">💰 Операции (${a.dayTx.length})</div>
      ${a.dayTx.map(t => {
        const c = catById(t.type, t.category);
        return `
        <div class="mini-tx">
          <span class="mini-tx-icon">${c.icon}</span>
          <div class="mini-tx-info">
            <div class="mini-tx-name">${escapeHtml(c.name)}</div>
            ${t.note ? `<div class="mini-tx-note">${escapeHtml(t.note)}</div>` : ''}
          </div>
          <span class="mini-tx-amt ${t.type === 'income' ? 'income' : 'expense'}">
            ${t.type === 'income' ? '+' : '−'}${money(t.amount)}
          </span>
        </div>`;
      }).join('')}
      <div class="goal-stats" style="margin-top:10px">
        <span>Доход: <b class="income">${money(a.dayIncome)}</b></span>
        <span>Расход: <b class="expense">${money(a.dayExpense)}</b></span>
        <span>Баланс: <b>${money(a.dayIncome - a.dayExpense)}</b></span>
      </div>
    </div>`;
  }

  // 6. Выполненные задачи
  const dayTasks = state.planner[iso] || [];
  const doneTasks = dayTasks.filter(t => t.done);
  if (doneTasks.length) {
    bodyHTML += `<div class="day-section">
      <div class="day-section-title">✅ Выполнено (${doneTasks.length})</div>
      ${doneTasks.map(t => `
        <div class="mini-tx">
          <span class="mini-tx-icon">✓</span>
          <div class="mini-tx-info">
            <div class="mini-tx-name">${escapeHtml(t.text)}</div>
          </div>
          <span class="mini-tx-amt">${t.time}</span>
        </div>
      `).join('')}
    </div>`;
  }

  if (!hasContent) {
    bodyHTML = `<div class="empty"><div class="big">📅</div>За этот день нет данных</div>`;
  }

  overlay.innerHTML = `
    <div class="popup day-popup">
      <div class="day-head">
        <div>
          <div class="day-head-title">${fmtDateFull(iso)}</div>
          <div class="day-head-sub">${iso.split('-').reverse().join('.')}</div>
        </div>
        <button type="button" class="day-close" data-day-close>×</button>
      </div>
      <div class="day-body">${bodyHTML}</div>
    </div>
  `;

  overlay.addEventListener('click', e => {
    if (e.target === overlay || e.target.closest('[data-day-close]')) closePopup();
  });
}

/* ============================ MAIN RENDER ============================ */

function render() {
  document.querySelectorAll('#nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === ui.tab);
  });

  const hidePeriod = ['planner', 'plans', 'goals', 'debts'].includes(ui.tab);
  document.getElementById('periodBar').classList.toggle('hidden', hidePeriod);
  if (!hidePeriod) renderPeriodBar();

  const main = document.getElementById('main');
  if (ui.tab === 'dashboard') main.innerHTML = renderDashboard();
  else if (ui.tab === 'transactions') main.innerHTML = renderTransactions();
  else if (ui.tab === 'analytics') main.innerHTML = renderAnalytics();
  else if (ui.tab === 'plans') main.innerHTML = renderPlans();
  else if (ui.tab === 'goals') main.innerHTML = renderGoals();
  else if (ui.tab === 'debts') main.innerHTML = renderDebts();
  else if (ui.tab === 'distribution') main.innerHTML = renderDistribution();
  else if (ui.tab === 'planner') main.innerHTML = renderPlanner();

  attachHandlers();
}

/* ============================ HANDLERS ============================ */

function updateCatTrigger() {
  const trigger = document.querySelector('[data-select-for="txCat"]');
  if (!trigger) return;
  const cat = catById(ui.txType, ui.txCat);
  trigger.querySelector('.st-icon').textContent = cat.icon;
  trigger.querySelector('.st-text').textContent = cat.name;
  trigger.dataset.selectValue = ui.txCat;
}

function attachHandlers() {
  document.querySelectorAll('[data-dist-input]').forEach(inp => {
    inp.addEventListener('input', () => {
      const g = inp.dataset.distInput;
      const v = Math.max(0, Math.min(100, parseInt(inp.value) || 0));
      state.distribution[g] = v;
      save();
      refreshDistributionNumbers();
    });
    inp.addEventListener('blur', () => render());
  });

  const distBaseInput = document.getElementById('distBase');
  if (distBaseInput) {
    distBaseInput.addEventListener('input', () => {
      ui.distBase = parseFloat(distBaseInput.value) || 0;
      refreshDistributionNumbers();
    });
  }
}

function refreshDistributionNumbers() {
  const tx = filteredTx();
  const periodIncome = tx.filter(t => t.type === 'income').reduce((s,t) => s + t.amount, 0);
  const dist = calcDistribution(periodIncome);

  document.querySelectorAll('[data-dist-input]').forEach(inp => {
    const g = inp.dataset.distInput;
    const card = inp.closest('.dist-card');
    if (!card) return;
    const amtEl = card.querySelector('.amount');
    if (amtEl) amtEl.textContent = money(dist[g].plan);

    const actual = tx.filter(t => t.type === 'expense').filter(t => {
      const c = CATEGORIES.expense.find(x => x.id === t.category);
      return c && c.group === g;
    }).reduce((s,t) => s + t.amount, 0);

    const plan = dist[g].plan;
    const diff = actual - plan;
    const actualEl = card.querySelector('.actual');
    if (actualEl) {
      actualEl.innerHTML = `Потрачено: <b>${money(actual)}</b><br>
        <span style="color:${diff > 0 ? 'var(--red)' : 'var(--green)'}">
          ${diff > 0 ? '▲ перерасход ' + money(diff) : '▼ остаток ' + money(-diff)}
        </span>`;
    }
    const barEl = card.querySelector('.bar-fill');
    if (barEl) barEl.style.width = (plan > 0 ? Math.min(100, actual/plan*100) : 0) + '%';
  });

  const totalPct = state.distribution.needs + state.distribution.wants + state.distribution.savings + state.distribution.debts;
  const progTotal = document.querySelector('.progress-total');
  if (progTotal) {
    progTotal.innerHTML = Object.keys(GROUPS).map(g =>
      `<div style="width:${state.distribution[g]}%;background:${GROUPS[g].color}"></div>`
    ).join('');
  }
  const badge = document.querySelector('.pct-badge');
  if (badge) {
    badge.textContent = `Сумма: ${totalPct}%`;
    badge.className = `pct-badge ${totalPct === 100 ? 'ok' : 'warn'}`;
  }
}

/* ============================ GLOBAL EVENTS ============================ */

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopup(); });

document.addEventListener('click', e => {
  // brand → dashboard
  if (e.target.closest('#brand')) {
    ui.tab = 'dashboard';
    closePopup();
    render();
    return;
  }

  // nav
  const navBtn = e.target.closest('#nav button');
  if (navBtn) {
    ui.tab = navBtn.dataset.tab;
    closePopup();
    render();
    return;
  }

  // period chips
  const chip = e.target.closest('[data-period]');
  if (chip) {
    ui.period = chip.dataset.period;
    if (ui.period === 'custom') {
      if (!ui.customFrom) ui.customFrom = todayStr();
      if (!ui.customTo) ui.customTo = todayStr();
    }
    render();
    return;
  }

  // date triggers
  const dateTrig = e.target.closest('[data-date-for]');
  if (dateTrig) {
    const key = dateTrig.dataset.dateFor;
    const current = dateTrig.dataset.dateValue || todayStr();
    openCalendarPopup(current, v => {
      if (key === 'periodFrom') { ui.customFrom = v; render(); }
      else if (key === 'periodTo') { ui.customTo = v; render(); }
      else if (key === 'plannerDate') { ui.plannerDate = v; render(); }
      else {
        dateTrig.dataset.dateValue = v;
        dateTrig.querySelector('.dt-text').textContent = fmtDateHuman(v);
      }
    });
    return;
  }

  // time triggers
  const timeTrig = e.target.closest('[data-time-for]');
  if (timeTrig) {
    const key = timeTrig.dataset.timeFor;
    const current = timeTrig.dataset.timeValue || '09:00';
    openTimePicker(current, v => {
      timeTrig.dataset.timeValue = v;
      timeTrig.querySelector('.tt-text').textContent = v;
    });
    return;
  }

  // select triggers
  const selTrig = e.target.closest('[data-select-for]');
  if (selTrig) {
    const key = selTrig.dataset.selectFor;
    if (key === 'txCat') {
      openSelectPopup('Категория', CATEGORIES[ui.txType], ui.txCat, v => {
        ui.txCat = v;
        updateCatTrigger();
      });
    } else if (key === 'debtType') {
      const opts = Object.entries(DEBT_TYPES).map(([id, t]) => ({ id, name: t.name, icon: t.icon }));
      openSelectPopup('Тип долга', opts, selTrig.dataset.selectValue, v => {
        selTrig.dataset.selectValue = v;
        selTrig.querySelector('.st-icon').textContent = DEBT_TYPES[v].icon;
        selTrig.querySelector('.st-text').textContent = DEBT_TYPES[v].name;
      });
    }
    return;
  }

  // type toggle
  const typeBtn = e.target.closest('#typeToggle button');
  if (typeBtn) {
    const newType = typeBtn.dataset.type;
    if (newType === ui.txType) return;
    ui.txType = newType;
    ui.txCat = CATEGORIES[newType][0].id;
    document.querySelectorAll('#typeToggle button').forEach(b => {
      if (b.dataset.type === 'income') b.className = newType === 'income' ? 'active inc' : '';
      if (b.dataset.type === 'expense') b.className = newType === 'expense' ? 'active exp' : '';
    });
    updateCatTrigger();
    return;
  }

  // delete transaction
  const delTx = e.target.closest('[data-del-tx]');
  if (delTx) {
    state.transactions = state.transactions.filter(t => t.id !== delTx.dataset.delTx);
    save(); render(); return;
  }

  // task toggle
  const toggle = e.target.closest('[data-task-toggle]');
  if (toggle) {
    const [date, id] = toggle.dataset.taskToggle.split('|');
    const t = (state.planner[date] || []).find(x => x.id === id);
    if (t) { t.done = !t.done; save(); render(); }
    return;
  }
  const delTask = e.target.closest('[data-task-del]');
  if (delTask) {
    const [date, id] = delTask.dataset.taskDel.split('|');
    state.planner[date] = (state.planner[date] || []).filter(x => x.id !== id);
    if (!state.planner[date].length) delete state.planner[date];
    save(); render(); return;
  }

  // goto date
  const goto = e.target.closest('[data-goto-date]');
  if (goto) { ui.plannerDate = goto.dataset.gotoDate; render(); return; }

  // planner shifts
  const shift = e.target.closest('[data-planner-shift]');
  if (shift) {
    const d = new Date(ui.plannerDate + 'T00:00:00');
    d.setDate(d.getDate() + parseInt(shift.dataset.plannerShift));
    ui.plannerDate = fmtDateLocal(d);
    render(); return;
  }
  if (e.target.closest('[data-planner-today]')) { ui.plannerDate = todayStr(); render(); return; }

  // day view
  const dayView = e.target.closest('[data-day-view]');
  if (dayView) { openDayAnalytics(dayView.dataset.dayView); return; }

  // distribution presets
  if (e.target.closest('#distAuto')) { ui.distBase = null; render(); return; }
  if (e.target.closest('#preset1')) { state.distribution = { needs: 40, wants: 20, savings: 20, debts: 20 }; save(); render(); return; }
  if (e.target.closest('#preset2')) { state.distribution = { needs: 50, wants: 20, savings: 20, debts: 10 }; save(); render(); return; }
  if (e.target.closest('#preset3')) { state.distribution = { needs: 35, wants: 15, savings: 30, debts: 20 }; save(); render(); return; }

  // plan delete
  const planDel = e.target.closest('[data-plan-del]');
  if (planDel) {
    state.plans = state.plans.filter(p => p.id !== planDel.dataset.planDel);
    save(); render(); return;
  }

  // plan subtask toggle
  const planToggle = e.target.closest('[data-plan-toggle]');
  if (planToggle) {
    const [planId, subId] = planToggle.dataset.planToggle.split('|');
    const plan = state.plans.find(p => p.id === planId);
    if (plan) {
      const s = plan.subtasks.find(x => x.id === subId);
      if (s) { s.done = !s.done; save(); render(); }
    }
    return;
  }

  // plan subtask delete
  const planSubDel = e.target.closest('[data-plan-sub-del]');
  if (planSubDel) {
    const [planId, subId] = planSubDel.dataset.planSubDel.split('|');
    const plan = state.plans.find(p => p.id === planId);
    if (plan) {
      plan.subtasks = plan.subtasks.filter(x => x.id !== subId);
      save(); render();
    }
    return;
  }

  // goal delete
  const goalDel = e.target.closest('[data-goal-del]');
  if (goalDel) {
    state.goals = state.goals.filter(g => g.id !== goalDel.dataset.goalDel);
    save(); render(); return;
  }

  // goal dist apply
  const goalDist = e.target.closest('[data-goal-dist]');
  if (goalDist) {
    const g = state.goals.find(x => x.id === goalDist.dataset.goalDist);
    if (g) {
      const sug = suggestedDistributionForGoal(g);
      state.distribution = { ...sug.suggested };
      save();
      alert('Распределение обновлено на основе цели и долгов!');
      ui.tab = 'distribution';
      render();
    }
    return;
  }

  // debt delete
  const debtDel = e.target.closest('[data-debt-del]');
  if (debtDel) {
    state.debts = state.debts.filter(d => d.id !== debtDel.dataset.debtDel);
    save(); render(); return;
  }
});

// Forms
document.addEventListener('submit', e => {
  // tx
  if (e.target.id === 'txForm') {
    e.preventDefault();
    const amount = parseFloat(document.getElementById('txAmount').value);
    if (!amount || amount <= 0) return;
    const dateTrig = document.querySelector('[data-date-for="txDate"]');
    const date = dateTrig ? dateTrig.dataset.dateValue : todayStr();
    state.transactions.push({
      id: uid(), type: ui.txType, amount,
      category: ui.txCat, date,
      note: document.getElementById('txNote').value.trim()
    });
    save(); render();
    return;
  }

  // task
  if (e.target.id === 'taskForm') {
    e.preventDefault();
    const timeTrig = document.querySelector('[data-time-for="taskTime"]');
    const time = timeTrig ? timeTrig.dataset.timeValue : '09:00';
    const text = document.getElementById('taskText').value.trim();
    if (!text) return;
    const d = ui.plannerDate;
    if (!state.planner[d]) state.planner[d] = [];
    state.planner[d].push({ id: uid(), time, text, done: false });
    save(); render();
    return;
  }

  // plan
  if (e.target.id === 'planForm') {
    e.preventDefault();
    const title = document.getElementById('planTitle').value.trim();
    if (!title) return;
    const dateTrig = document.querySelector('[data-date-for="planEnd"]');
    const endDate = dateTrig ? dateTrig.dataset.dateValue : null;
    state.plans.push({
      id: uid(), title, endDate,
      subtasks: [],
      createdAt: todayStr()
    });
    save(); render();
    return;
  }

  // plan subtask add
  const planAddAttr = e.target.dataset.planAdd;
  if (planAddAttr) {
    e.preventDefault();
    const input = e.target.querySelector('input');
    const text = input.value.trim();
    if (!text) return;
    const plan = state.plans.find(p => p.id === planAddAttr);
    if (plan) {
      plan.subtasks.push({ id: uid(), text, done: false });
      save(); render();
    }
    return;
  }

  // goal
  if (e.target.id === 'goalForm') {
    e.preventDefault();
    const title = document.getElementById('goalTitle').value.trim();
    const amount = parseFloat(document.getElementById('goalAmount').value);
    const periodDays = parseInt(document.getElementById('goalPeriod').value) || 90;
    if (!title || !amount) return;
    state.goals.push({
      id: uid(), title, amount, periodDays,
      saved: 0,
      createdAt: todayStr()
    });
    save(); render();
    return;
  }

  // goal add savings
  const goalAddAttr = e.target.dataset.goalAdd;
  if (goalAddAttr) {
    e.preventDefault();
    const input = e.target.querySelector('input');
    const amount = parseFloat(input.value);
    if (!amount || amount <= 0) return;
    const g = state.goals.find(x => x.id === goalAddAttr);
    if (g) {
      g.saved = (g.saved || 0) + amount;
      // также добавим транзакцию
      state.transactions.push({
        id: uid(), type: 'expense', amount,
        category: 'savings',
        date: todayStr(),
        note: `Пополнение цели: ${g.title}`
      });
      save(); render();
    }
    return;
  }

  // debt
  if (e.target.id === 'debtForm') {
    e.preventDefault();
    const name = document.getElementById('debtName').value.trim();
    const amount = parseFloat(document.getElementById('debtAmount').value);
    const typeTrig = document.querySelector('[data-select-for="debtType"]');
    const type = typeTrig ? typeTrig.dataset.selectValue : 'mfo';
    if (!name || !amount) return;
    state.debts.push({
      id: uid(), name, type, amount,
      paid: 0,
      createdAt: todayStr()
    });
    save(); render();
    return;
  }

  // debt payment
  const debtAddAttr = e.target.dataset.debtAdd;
  if (debtAddAttr) {
    e.preventDefault();
    const input = e.target.querySelector('input');
    const amount = parseFloat(input.value);
    if (!amount || amount <= 0) return;
    const d = state.debts.find(x => x.id === debtAddAttr);
    if (d) {
      d.paid = Math.min(d.amount, (d.paid || 0) + amount);
      // добавим транзакцию
      const catMap = { mfo: 'debt_mfo', credit: 'debt_credit', friend: 'debt_friend', other: 'debt_mfo' };
      state.transactions.push({
        id: uid(), type: 'expense', amount,
        category: catMap[d.type] || 'debt_mfo',
        date: todayStr(),
        note: `Платёж по долгу: ${d.name}`
      });
      save(); render();
    }
    return;
  }
});

/* ============================ INIT ============================ */
render();
</script>
</body>
</html>
