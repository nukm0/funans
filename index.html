<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>Финансы</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0d0f14;
  --panel: #151922;
  --panel2: #1b2029;
  --panel3: #222836;
  --border: #242b38;
  --text: #e8ecf4;
  --muted: #8892a6;
  --accent: #4f8cff;
  --green: #22c55e;
  --red: #ef4444;
  --purple: #a06bff;
  --orange: #f59e0b;
  --radius: 14px;
}
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  overflow-x: hidden;
}
.app { max-width: 1280px; margin: 0 auto; padding: 20px; padding-bottom: env(safe-area-inset-bottom, 20px); }

/* Header */
header {
  display: flex; flex-wrap: wrap; gap: 16px;
  align-items: center; justify-content: space-between;
  padding: 14px 20px; background: var(--panel);
  border: 1px solid var(--border); border-radius: var(--radius);
  margin-bottom: 14px;
}
.brand {
  font-size: 20px; font-weight: 700; letter-spacing: -0.3px;
  cursor: pointer; user-select: none; transition: .15s;
  display: flex; align-items: center; gap: 8px;
}
.brand::before { content: '💰'; font-size: 22px; }
.brand:hover { color: var(--accent); }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button {
  background: transparent; border: 1px solid transparent; color: var(--muted);
  padding: 8px 14px; border-radius: 10px; cursor: pointer;
  font-size: 14px; font-weight: 500; transition: .15s;
  font-family: inherit;
}
nav button:hover { color: var(--text); background: var(--panel2); }
nav button.active { background: var(--accent); color: #fff; }

/* Period bar */
.period-bar {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 12px 16px; background: var(--panel);
  border: 1px solid var(--border); border-radius: var(--radius);
  margin-bottom: 14px;
}
.period-bar .label { color: var(--muted); font-size: 13px; margin-right: 4px; }
.chip {
  background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
  padding: 7px 13px; border-radius: 999px; cursor: pointer; font-size: 13px;
  transition: .15s; font-family: inherit; font-weight: 500;
}
.chip:hover { color: var(--text); }
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.period-bar .range-note { margin-left: auto; color: var(--muted); font-size: 13px; }

/* Inputs */
input, select, textarea, button { font-family: inherit; font-size: 14px; }
input[type=text], input[type=number], input[type=date], select, textarea {
  background: var(--panel2); border: 1px solid var(--border); color: var(--text);
  padding: 10px 12px; border-radius: 10px; outline: none; transition: .15s;
  width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }

/* Remove number spinners */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button {
  -webkit-appearance: none; margin: 0;
}
input[type=number] { -moz-appearance: textfield; appearance: textfield; }

/* Buttons */
.btn {
  background: var(--accent); color: #fff; border: none;
  padding: 10px 18px; border-radius: 10px; cursor: pointer;
  font-weight: 600; font-size: 14px; transition: .15s;
  font-family: inherit;
}
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: scale(.98); }
.btn.ghost { background: var(--panel2); border: 1px solid var(--border); color: var(--text); }
.btn.ghost:hover { border-color: var(--accent); }
.btn.small { padding: 7px 12px; font-size: 13px; }
.btn.danger { background: transparent; border: 1px solid var(--red); color: var(--red); }

/* Trigger buttons for calendar/select/time */
.date-trigger, .select-trigger, .time-trigger {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 10px;
  background: var(--panel2); border: 1px solid var(--border);
  color: var(--text); cursor: pointer; font-size: 14px;
  text-align: left; transition: .15s;
  font-family: inherit;
}
.date-trigger:hover, .select-trigger:hover, .time-trigger:hover { border-color: var(--accent); }
.date-trigger.compact, .time-trigger.compact { padding: 7px 12px; font-size: 13px; width: auto; }
.dt-icon, .st-arrow, .tt-icon { margin-left: auto; opacity: .55; font-size: 15px; }
.select-trigger .st-icon { font-size: 18px; }
.select-trigger .st-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.time-trigger .tt-text { flex: 1; font-variant-numeric: tabular-nums; font-weight: 600; }

/* Cards */
.grid { display: grid; gap: 14px; }
.cards-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.cards-3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.two-col { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }

.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px;
}
.card h3 {
  font-size: 13px; font-weight: 600; color: var(--muted);
  margin-bottom: 14px; text-transform: uppercase; letter-spacing: .5px;
}

.stat .label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.stat .value { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
.stat .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
.income { color: var(--green); }
.expense { color: var(--red); }
.balance-pos { color: var(--accent); }
.balance-neg { color: var(--orange); }

/* Transactions */
.tx-form { display: grid; grid-template-columns: 1fr 1fr 1.3fr 1fr 1.5fr auto; gap: 10px; align-items: end; }
.type-toggle { display: flex; gap: 6px; }
.type-toggle button {
  flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--panel2); color: var(--muted); cursor: pointer; font-weight: 600;
  transition: .15s; font-family: inherit;
}
.type-toggle button.active.inc { background: rgba(34,197,94,.15); border-color: var(--green); color: var(--green); }
.type-toggle button.active.exp { background: rgba(239,68,68,.15); border-color: var(--red); color: var(--red); }

.tx-list { display: flex; flex-direction: column; gap: 8px; }
.tx-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; background: var(--panel2);
  border: 1px solid var(--border); border-radius: 12px;
}
.tx-icon {
  width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center;
  font-size: 19px; background: var(--panel); flex-shrink: 0;
}
.tx-info { flex: 1; min-width: 0; }
.tx-info .t { font-weight: 600; font-size: 14px; }
.tx-info .d { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-amount { font-weight: 700; font-size: 15px; white-space: nowrap; }
.tx-del {
  background: transparent; border: none; color: var(--muted); cursor: pointer;
  font-size: 20px; padding: 4px 8px; border-radius: 8px; line-height: 1;
  font-family: inherit;
}
.tx-del:hover { color: var(--red); background: rgba(239,68,68,.1); }

.date-group { margin-top: 18px; }
.date-group .date-head {
  font-size: 12px; color: var(--muted); text-transform: uppercase;
  letter-spacing: .5px; margin-bottom: 8px; padding-left: 4px;
}

/* Bars */
.bar-row { margin-bottom: 14px; }
.bar-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; gap: 8px; }
.bar-top .name { color: var(--text); font-weight: 500; }
.bar-top .val { color: var(--muted); white-space: nowrap; }
.bar-bg { height: 8px; background: var(--panel2); border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 99px; transition: width .4s ease; }

/* Donut */
.donut-wrap { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.donut { width: 160px; height: 160px; border-radius: 50%; position: relative; flex-shrink: 0; }
.donut::after { content: ''; position: absolute; inset: 26px; background: var(--panel); border-radius: 50%; }
.donut-center { position: absolute; inset: 0; display: grid; place-items: center; z-index: 2; text-align: center; pointer-events: none; }
.donut-center .v { font-size: 16px; font-weight: 700; }
.donut-center .l { font-size: 11px; color: var(--muted); }
.legend { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 180px; }
.legend-item { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.legend-item .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend-item .v { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Daily chart */
.daily-chart { display: flex; align-items: flex-end; gap: 3px; height: 140px; padding-top: 10px; overflow-x: auto; }
.daily-bar { flex: 1; min-width: 8px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; height: 100%; position: relative; }
.daily-bar .b { width: 100%; border-radius: 3px 3px 0 0; transition: height .3s; }
.daily-bar .b.inc { background: var(--green); }
.daily-bar .b.exp { background: var(--red); }
.daily-bar:hover::after {
  content: attr(data-tip); position: absolute; bottom: 100%; left: 50%;
  transform: translateX(-50%); background: #000; color: #fff; font-size: 11px;
  padding: 4px 8px; border-radius: 6px; white-space: nowrap; z-index: 10;
}

/* Distribution */
.dist-card { position: relative; overflow: hidden; }
.dist-card .stripe { position: absolute; top: 0; left: 0; right: 0; height: 4px; }
.dist-card .dist-name { font-weight: 700; font-size: 15px; }
.dist-card .dist-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
.dist-card .pct-input { display: flex; align-items: center; gap: 6px; margin-top: 12px; }
.dist-card .pct-input input { width: 74px; text-align: center; font-weight: 700; }
.dist-card .amount { font-size: 24px; font-weight: 700; margin-top: 12px; letter-spacing: -0.5px; }
.dist-card .actual { font-size: 12px; margin-top: 10px; color: var(--muted); line-height: 1.6; }

.card-head-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; flex-wrap: wrap; margin-bottom: 14px;
}
.card-head-row h3 { margin-bottom: 0; }
.pct-badge {
  font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
  background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
}
.pct-badge.ok { color: var(--green); border-color: rgba(34,197,94,.4); background: rgba(34,197,94,.1); }
.pct-badge.warn { color: var(--orange); border-color: rgba(245,158,11,.4); background: rgba(245,158,11,.1); }

.progress-total { height: 10px; background: var(--panel2); border-radius: 99px; overflow: hidden; display: flex; margin: 8px 0 12px; }

/* Planner */
.planner-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.planner-date { font-size: 17px; font-weight: 700; }
.task-form { display: grid; grid-template-columns: 140px 1fr auto; gap: 10px; align-items: end; }

.task-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.task {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  background: var(--panel2); border: 1px solid var(--border); border-radius: 12px;
  border-left: 3px solid var(--accent);
}
.task.done { opacity: .5; }
.task.done .task-text { text-decoration: line-through; }
.task-time {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px;
  color: var(--accent); min-width: 52px;
}
.task-text { flex: 1; font-size: 14px; word-break: break-word; }
.task-check {
  width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--border);
  background: transparent; cursor: pointer; display: grid; place-items: center;
  color: transparent; font-size: 13px; flex-shrink: 0;
  font-family: inherit;
}
.task-check:hover { border-color: var(--accent); }
.task.done .task-check { background: var(--green); border-color: var(--green); color: #fff; }

/* Empty */
.empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }
.empty .big { font-size: 40px; margin-bottom: 10px; opacity: .5; }

/* Row / misc */
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.mt { margin-top: 14px; }
.muted { color: var(--muted); font-size: 13px; }
.hidden { display: none !important; }

/* Alerts / warnings */
.alert-list { display: flex; flex-direction: column; gap: 8px; }
.alert-item {
  display: flex; gap: 12px; padding: 12px 14px;
  background: var(--panel2); border: 1px solid var(--border);
  border-radius: 12px; border-left: 3px solid var(--orange);
}
.alert-item.critical { border-left-color: var(--red); }
.alert-item.info { border-left-color: var(--accent); }
.alert-icon { font-size: 18px; flex-shrink: 0; }
.alert-body { flex: 1; min-width: 0; }
.alert-title { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
.alert-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
.alert-date { font-size: 11px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }

/* ========== POPUPS ========== */
.popup-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.7);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  display: grid; place-items: center;
  z-index: 1000;
  padding: 16px;
  animation: fadeIn .15s ease;
}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
@keyframes popIn { from { opacity: 0; transform: scale(.95) } to { opacity: 1; transform: scale(1) } }
@keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }

.popup {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  width: 100%;
  box-shadow: 0 24px 60px rgba(0,0,0,.6);
  animation: popIn .2s ease;
  overflow: hidden;
}

/* Calendar — compact */
.calendar-popup { padding: 14px; max-width: 320px; }
.cal-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px; gap: 6px;
}
.cal-nav {
  width: 30px; height: 30px; border-radius: 9px;
  background: var(--panel2); border: 1px solid var(--border);
  color: var(--text); font-size: 16px; cursor: pointer;
  display: grid; place-items: center;
  transition: .15s; font-family: inherit; line-height: 1;
  flex-shrink: 0;
}
.cal-nav:hover { background: var(--border); color: var(--accent); }
.cal-title { font-weight: 700; font-size: 13px; letter-spacing: -0.1px; white-space: nowrap; }

.cal-week {
  display: grid; grid-template-columns: repeat(7, 1fr);
  margin-bottom: 4px;
  color: var(--muted); font-size: 10px; text-align: center;
  text-transform: uppercase; letter-spacing: .3px; font-weight: 600;
}
.cal-week span { padding: 3px 0; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
.cal-day {
  aspect-ratio: 1; border: none; background: transparent;
  color: var(--text); font-size: 12px; cursor: pointer;
  border-radius: 7px; font-weight: 500;
  display: grid; place-items: center;
  transition: .12s; font-family: inherit;
  position: relative;
}
.cal-day:hover { background: var(--panel2); }
.cal-day.empty { cursor: default; }
.cal-day.today { color: var(--accent); font-weight: 700; box-shadow: inset 0 0 0 1px var(--accent); }
.cal-day.selected { background: var(--accent); color: #fff; font-weight: 700; box-shadow: none; }
.cal-day.has-violation { background: rgba(239,68,68,.18); color: var(--red); }
.cal-day.has-violation.selected { background: var(--red); color: #fff; }
.cal-day.has-success { background: rgba(34,197,94,.15); color: var(--green); }
.cal-day.has-success.selected { background: var(--green); color: #fff; }
.cal-day .dot {
  position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
  width: 3px; height: 3px; border-radius: 50%; background: currentColor;
}

.cal-foot {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border); gap: 8px;
}
.cal-foot .btn { padding: 7px 12px; font-size: 12px; }

/* Time popup */
.time-popup { padding: 16px; max-width: 280px; }
.time-display {
  text-align: center; font-size: 40px; font-weight: 700;
  font-variant-numeric: tabular-nums; letter-spacing: -1px;
  color: var(--accent); margin-bottom: 16px;
  padding: 8px 0;
}
.time-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.time-col-label { font-size: 11px; color: var(--muted); text-align: center; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
.time-scroll {
  height: 150px; overflow-y: auto; scroll-snap-type: y mandatory;
  -ms-overflow-style: none; scrollbar-width: none;
  border-radius: 10px; background: var(--panel2);
  border: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding: 55px 0;
}
.time-scroll::-webkit-scrollbar { display: none; }
.time-item {
  scroll-snap-align: center;
  text-align: center; padding: 8px 4px;
  font-size: 20px; font-variant-numeric: tabular-nums;
  color: var(--muted); cursor: pointer;
  transition: .12s; font-weight: 500;
  user-select: none;
}
.time-item:hover { color: var(--text); background: var(--panel3); }
.time-item.active { color: var(--accent); font-weight: 700; font-size: 24px; }

.time-quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; justify-content: center; }
.time-quick button {
  background: var(--panel2); border: 1px solid var(--border); color: var(--text);
  padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 12px;
  font-family: inherit; transition: .15s;
}
.time-quick button:hover { border-color: var(--accent); color: var(--accent); }

/* Select popup */
.select-popup { padding: 8px; max-height: 70vh; overflow-y: auto; }
.select-head {
  padding: 12px 14px 6px;
  font-size: 12px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .5px; font-weight: 600;
}
.sel-item {
  width: 100%; display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; background: transparent; border: none;
  color: var(--text); cursor: pointer; border-radius: 12px;
  text-align: left; font-size: 15px;
  transition: .12s; font-family: inherit;
}
.sel-item:hover { background: var(--panel2); }
.sel-item.selected { background: rgba(79,140,255,.15); color: var(--accent); font-weight: 600; }
.sel-icon { font-size: 20px; width: 28px; text-align: center; flex-shrink: 0; }
.sel-name { flex: 1; }
.sel-group-label {
  padding: 12px 14px 4px; font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .5px; font-weight: 600;
}

/* Progress bar (plans) */
.plan-item {
  padding: 14px; background: var(--panel2);
  border: 1px solid var(--border); border-radius: 12px;
  margin-bottom: 10px;
}
.plan-head {
  display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px;
}
.plan-title { flex: 1; font-weight: 600; font-size: 14px; word-break: break-word; }
.plan-period { font-size: 11px; color: var(--muted); margin-top: 2px; }
.plan-pct { font-size: 15px; font-weight: 700; color: var(--accent); flex-shrink: 0; }
.plan-bar { height: 10px; background: var(--panel); border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
.plan-bar-fill { height: 100%; border-radius: 99px; transition: width .3s; }

.subtasks { display: flex; flex-direction: column; gap: 6px; }
.subtask {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; background: var(--panel); border-radius: 9px;
  font-size: 13px;
}
.subtask.done { opacity: .5; }
.subtask.done .subtask-text { text-decoration: line-through; }
.subtask-check {
  width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--border);
  background: transparent; cursor: pointer; display: grid; place-items: center;
  color: transparent; font-size: 12px; flex-shrink: 0;
  font-family: inherit;
}
.subtask.done .subtask-check { background: var(--green); border-color: var(--green); color: #fff; }
.subtask-text { flex: 1; word-break: break-word; }
.subtask-del {
  background: transparent; border: none; color: var(--muted); cursor: pointer;
  font-size: 16px; padding: 2px 6px; border-radius: 6px; line-height: 1;
  font-family: inherit;
}
.subtask-del:hover { color: var(--red); }

.plan-add-form {
  display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 8px;
}
.plan-add-form input { font-size: 13px; padding: 8px 10px; }

/* Goals */
.goal-card {
  padding: 16px; background: var(--panel2);
  border: 1px solid var(--border); border-radius: 12px;
  margin-bottom: 12px; position: relative; overflow: hidden;
}
.goal-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.goal-emoji { font-size: 28px; flex-shrink: 0; }
.goal-info { flex: 1; min-width: 0; }
.goal-title { font-weight: 700; font-size: 15px; word-break: break-word; }
.goal-period { font-size: 12px; color: var(--muted); margin-top: 2px; }
.goal-amount { font-size: 20px; font-weight: 700; color: var(--accent); margin-top: 6px; }
.goal-del {
  background: transparent; border: none; color: var(--muted); cursor: pointer;
  font-size: 18px; padding: 4px 8px; border-radius: 8px; line-height: 1;
  font-family: inherit;
}
.goal-del:hover { color: var(--red); }

.goal-progress {
  height: 12px; background: var(--panel); border-radius: 99px; overflow: hidden;
  margin: 10px 0 6px;
}
.goal-progress-fill { height: 100%; border-radius: 99px; transition: width .3s; }
.goal-stats {
  display: flex; justify-content: space-between; gap: 10px;
  font-size: 12px; color: var(--muted); flex-wrap: wrap;
}
.goal-stats b { color: var(--text); }

.goal-tip {
  margin-top: 12px; padding: 10px 12px;
  background: var(--panel); border-radius: 10px;
  font-size: 12px; color: var(--muted); line-height: 1.6;
  border-left: 3px solid var(--purple);
}
.goal-tip b { color: var(--purple); }

/* Debts */
.debt-card {
  padding: 14px; background: var(--panel2);
  border: 1px solid var(--border); border-radius: 12px;
  margin-bottom: 10px;
}
.debt-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.debt-info { flex: 1; min-width: 0; }
.debt-name { font-weight: 600; font-size: 14px; }
.debt-type { font-size: 11px; color: var(--muted); margin-top: 2px; }
.debt-amount { font-size: 16px; font-weight: 700; color: var(--red); margin-top: 4px; }
.debt-del {
  background: transparent; border: none; color: var(--muted); cursor: pointer;
  font-size: 18px; padding: 4px 8px; border-radius: 8px; line-height: 1;
  font-family: inherit;
}
.debt-del:hover { color: var(--red); }
.debt-progress { height: 8px; background: var(--panel); border-radius: 99px; overflow: hidden; margin-bottom: 8px; }
.debt-progress-fill { height: 100%; background: var(--red); border-radius: 99px; transition: width .3s; }
.debt-detail { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); flex-wrap: wrap; gap: 6px; }

/* Day analytics modal */
.day-popup { max-width: 460px; padding: 0; }
.day-head {
  padding: 18px 20px 14px; border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
}
.day-head-title { font-size: 17px; font-weight: 700; }
.day-head-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
.day-close {
  background: transparent; border: none; color: var(--muted); cursor: pointer;
  font-size: 24px; line-height: 1; padding: 2px 6px; border-radius: 8px;
  font-family: inherit;
}
.day-close:hover { color: var(--text); background: var(--panel2); }
.day-body { padding: 16px 20px 20px; max-height: 70vh; overflow-y: auto; }
.day-section { margin-bottom: 18px; }
.day-section:last-child { margin-bottom: 0; }
.day-section-title {
  font-size: 11px; color: var(--muted); text-transform: uppercase;
  letter-spacing: .5px; font-weight: 700; margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.day-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
}
.day-badge.ok { background: rgba(34,197,94,.15); color: var(--green); }
.day-badge.bad { background: rgba(239,68,68,.15); color: var(--red); }

.mini-tx {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; background: var(--panel2); border-radius: 9px;
  margin-bottom: 6px; font-size: 13px;
}
.mini-tx-icon { font-size: 16px; flex-shrink: 0; }
.mini-tx-info { flex: 1; min-width: 0; }
.mini-tx-name { font-weight: 500; }
.mini-tx-note { font-size: 11px; color: var(--muted); }
.mini-tx-amt { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ========== MOBILE ========== */
@media (max-width: 900px) {
  .tx-form { grid-template-columns: 1fr 1fr; }
  .tx-form > *:nth-child(2) { grid-column: 2; }
}

@media (max-width: 700px) {
  .app { padding: 10px; }
  header { padding: 12px 14px; gap: 12px; flex-direction: column; align-items: stretch; }
  .brand { justify-content: center; font-size: 19px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }

  .period-bar::-webkit-scrollbar { display: none; }
  .period-bar > * { flex-shrink: 0; }
  .period-bar .range-note { display: none; }

  input, select, textarea, .date-trigger, .select-trigger, .time-trigger, .btn { font-size: 16px; }
  .btn.small { font-size: 14px; }
  .chip { font-size: 13px; }

  .cards-4 { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .cards-3 { grid-template-columns: 1fr; }
  .two-col { grid-template-columns: 1fr; }
  .stat .value { font-size: 18px; }
  .stat .label { font-size: 12px; }
  .card { padding: 15px; }
  .card h3 { font-size: 12px; margin-bottom: 12px; }

  .tx-form { grid-template-columns: 1fr !important; }
  .task-form { grid-template-columns: 1fr !important; }

  .donut-wrap { flex-direction: column; align-items: stretch; gap: 16px; }
  .donut { margin: 0 auto; }

  .planner-head { gap: 8px; }
  .planner-date { font-size: 15px; flex: 1; min-width: 0; }

  .popup-overlay { padding: 0; place-items: end center; align-items: end; }
  .popup { max-width: 100%; border-radius: 22px 22px 0 0; max-height: 90vh; animation: slideUp .22s ease; padding-bottom: env(safe-area-inset-bottom, 0); }
  .calendar-popup { max-width: 100%; }
  .select-popup { max-height: 80vh; }
  .cal-day { font-size: 13px; }

  .dist-card .amount { font-size: 22px; }
  .dist-card .pct-input input { font-size: 16px; }

  .goal-amount { font-size: 18px; }
  .day-body { max-height: 75vh; }
}

@media (max-width: 380px) {
  .cards-4 { grid-template-columns: 1fr; }
}
</style>

<body>
<div class="app">
  <header>
    <div class="brand" id="brand">Финансы</div>
    <nav id="nav">
      <button data-tab="dashboard" class="active">Обзор</button>
      <button data-tab="transactions">Операции</button>

      <button data-tab="planner">Дневник</button>
    </nav>
  </header>

  <div class="period-bar" id="periodBar"></div>
  <main id="main"></main>
</div>

<script>
/* ============================ DATA ============================ */

const LS_KEY = 'finansy_v3';

const CATEGORIES = {
  income: [
    { id: 'salary',     name: 'Зарплата',              icon: '💼' },
    { id: 'advance',    name: 'Аванс',                 icon: '💵' },
    { id: 'freelance',  name: 'Фриланс',               icon: '💻' },
    { id: 'additional', name: 'Дополнительный доход',  icon: '💰' },
    { id: 'gift',       name: 'Подарок',               icon: '🎁' },
    { id: 'investment', name: 'Инвестиции',            icon: '📈' },
    { id: 'other_inc',  name: 'Другое',                icon: '✨' }
  ],
  expense: [
    { id: 'housing',     name: 'Жильё',         icon: '🏠', group: 'needs' },
    { id: 'utilities',   name: 'Коммуналка',    icon: '💡', group: 'needs' },
    { id: 'food',        name: 'Продукты',      icon: '🛒', group: 'needs' },
    { id: 'transport',   name: 'Транспорт',     icon: '🚌', group: 'needs' },
    { id: 'health',      name: 'Здоровье',      icon: '💊', group: 'needs' },
    { id: 'debt_mfo',    name: 'МФО',           icon: '🏪', group: 'debts' },
    { id: 'debt_credit', name: 'Кредит',        icon: '🏦', group: 'debts' },
    { id: 'debt_friend', name: 'Долг близким',  icon: '🤝', group: 'debts' },
    { id: 'cafe',        name: 'Кафе',          icon: '☕', group: 'wants' },
    { id: 'entertain',   name: 'Развлечения',   icon: '🎬', group: 'wants' },
    { id: 'shopping',    name: 'Покупки',       icon: '🛍️', group: 'wants' },
    { id: 'education',   name: 'Образование',   icon: '📚', group: 'wants' },
    { id: 'travel',      name: 'Путешествия',   icon: '✈️', group: 'wants' },
    { id: 'other_exp',   name: 'Другое',        icon: '📦', group: 'wants' },
    { id: 'savings',     name: 'Сбережения',    icon: '🏆', group: 'savings' },
    { id: 'invest',      name: 'Инвестиции',    icon: '📊', group: 'savings' }
  ]
};

const GROUPS = {
  needs:   { name: 'Обязательное', color: '#4f8cff', desc: 'Жильё, еда, транспорт, здоровье' },
  wants:   { name: 'Развлечения',  color: '#a06bff', desc: 'Кафе, кино, покупки, поездки' },
  savings: { name: 'Сбережения',   color: '#22c55e', desc: 'Накопления и инвестиции' },
  debts:   { name: 'Долги',        color: '#ef4444', desc: 'МФО, кредиты, займы у близких' }
};

const DEBT_TYPES = {
  mfo:    { name: 'МФО',          icon: '🏪', color: '#ef4444' },
  credit: { name: 'Кредит',       icon: '🏦', color: '#f59e0b' },
  friend: { name: 'Долг близким', icon: '🤝', color: '#a06bff' },
  other:  { name: 'Другое',       icon: '📌', color: '#8892a6' }
};

const PERIOD_LABELS = { day: 'День', week: 'Неделя', month: 'Месяц', year: 'Год', all: 'Всё', custom: 'Период' };

/* ============================ STATE ============================ */

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDateLocal(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

let state = (() => {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      parsed.plans = parsed.plans || [];
      parsed.goals = parsed.goals || [];
      parsed.debts = parsed.debts || [];
      return parsed;
    }
  } catch(e) {}
  return {
    transactions: [],
    planner: {},
    plans: [],
    goals: [],
    debts: [],
    distribution: { needs: 40, wants: 20, savings: 20, debts: 20 },
    currency: '₽'
  };
})();

let ui = {
  tab: 'dashboard',
  period: 'month',
  customFrom: '',
  customTo: '',
  txType: 'expense',
  txCat: 'housing',
  plannerDate: todayStr(),
  distBase: null
};

function save() { localStorage.setItem(LS_KEY, JSON.stringify(state)); }

/* ============================ UTILS ============================ */

function fmt(n) { return new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 }).format(n || 0); }
function money(n) { return fmt(n) + ' ' + state.currency; }

const MONTHS_FULL = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_SHORT = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const WEEKDAYS_FULL = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const WEEKDAYS_SHORT = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

function fmtDateHuman(iso) {
  if (!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  const t = todayStr();
  if (iso === t) return 'Сегодня';
  const yest = new Date(); yest.setDate(yest.getDate()-1);
  if (iso === fmtDateLocal(yest)) return 'Вчера';
  const tom = new Date(); tom.setDate(tom.getDate()+1);
  if (iso === fmtDateLocal(tom)) return 'Завтра';
  return `${d} ${MONTHS_SHORT[m-1]} ${y}`;
}

function fmtDateFull(iso) {
  if (!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  const date = new Date(y, m-1, d);
  return `${WEEKDAYS_FULL[date.getDay()]}, ${d} ${MONTHS_FULL[m-1].toLowerCase()} ${y}`;
}

function getRange() {
  const now = new Date();
  const t = todayStr();
  switch (ui.period) {
    case 'day': return [t, t];
    case 'week': {
      const d = new Date(now);
      const wd = (d.getDay() + 6) % 7;
      const s = new Date(d); s.setDate(d.getDate() - wd);
      const e = new Date(s); e.setDate(s.getDate() + 6);
      return [fmtDateLocal(s), fmtDateLocal(e)];
    }
    case 'month': {
      const s = new Date(now.getFullYear(), now.getMonth(), 1);
      const e = new Date(now.getFullYear(), now.getMonth()+1, 0);
      return [fmtDateLocal(s), fmtDateLocal(e)];
    }
    case 'year':
      return [`${now.getFullYear()}-01-01`, `${now.getFullYear()}-12-31`];
    case 'all': {
      if (!state.transactions.length) return [t, t];
      const ds = state.transactions.map(x => x.date).sort();
      return [ds[0], ds[ds.length-1]];
    }
    case 'custom':
      return [ui.customFrom || t, ui.customTo || t];
  }
  return [t, t];
}

function rangeLabel() {
  const [from, to] = getRange();
  if (ui.period === 'day') return fmtDateHuman(from);
  if (ui.period === 'all') return 'Всё время';
  if (from === to) return fmtDateHuman(from);
  return `${fmtDateHuman(from)} — ${fmtDateHuman(to)}`;
}

function filteredTx() {
  const [from, to] = getRange();
  return state.transactions.filter(t => t.date >= from && t.date <= to);
}

function daysBetween(from, to) {
  const a = new Date(from), b = new Date(to);
  return Math.round((b - a) / 86400000) + 1;
}

function catById(type, id) {
  return CATEGORIES[type].find(c => c.id === id) || { name: id, icon: '❓' };
}

function uid() { return Math.random().toString(36).slice(2, 10); }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================ POPUP SYSTEM ============================ */

let activePopup = null;
function closePopup() {
  if (activePopup) { activePopup.remove(); activePopup = null; }
}

/* ============================ CALENDAR ============================ */

function getDaysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function getFirstWeekday(y, m) { const d = new Date(y, m, 1).getDay(); return (d + 6) % 7; }

/**
 * Открывает компактный календарь.
 * options.dayStatus(iso) → null | 'ok' | 'bad'
 */
function openCalendarPopup(initialISO, onSelect, options = {}) {
  closePopup();

  const init = initialISO ? new Date(initialISO + 'T00:00:00') : new Date();
  let viewYear = init.getFullYear();
  let viewMonth = init.getMonth();
  let selected = initialISO || todayStr();
  const dayStatus = options.dayStatus || (() => null);

  const overlay = document.createElement('div');
  overlay.className = 'popup-overlay';
  document.body.appendChild(overlay);
  activePopup = overlay;

  const render = () => {
    const today = todayStr();
    const firstWd = getFirstWeekday(viewYear, viewMonth);
    const daysInMonth = getDaysInMonth(viewYear, viewMonth);

    let daysHTML = '';
    for (let i = 0; i < firstWd; i++) daysHTML += '<span class="cal-day empty"></span>';
    for (let day = 1; day <= daysInMonth; day++) {
      const iso = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const cls = ['cal-day'];
      if (iso === today) cls.push('today');
      if (iso === selected) cls.push('selected');
      const st = dayStatus(iso);
      if (st === 'bad') cls.push('has-violation');
      else if (st === 'ok') cls.push('has-success');
      daysHTML += `<button type="button" class="${cls.join(' ')}" data-day="${iso}">${day}</button>`;
    }

    overlay.innerHTML = `
      <div class="popup calendar-popup">
        <div class="cal-head">
          <button type="button" class="cal-nav" data-nav="-1">‹</button>
          <div class="cal-title">${MONTHS_FULL[viewMonth]} ${viewYear}</div>
          <button type="button" class="cal-nav" data-nav="1">›</button>
        </div>
        <div class="cal-week">
          ${WEEKDAYS_SHORT.map(w => `<span>${w}</span>`).join('')}
        </div>
        <div class="cal-grid">${daysHTML}</div>
        <div class="cal-foot">
          <button type="button" class="btn ghost small" data-cal-clear>Отмена</button>
          <button type="button" class="btn small" data-cal-today>Сегодня</button>
        </div>
      </div>
    `;
  };

  overlay.addEventListener('click', e => {
    if (e.target === overlay) { closePopup(); return; }
    const nav = e.target.closest('[data-nav]');
    if (nav) {
      viewMonth += parseInt(nav.dataset.nav);
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      render();
      return;
    }
    const day = e.target.closest('[data-day]');
    if (day) { onSelect(day.dataset.day); closePopup(); return; }
    if (e.target.closest('[data-cal-today]')) { onSelect(todayStr()); closePopup(); return; }
    if (e.target.closest('[data-cal-clear]')) closePopup();
  });

  render();
}

/* ============================ TIME PICKER ============================ */

function openTimePicker(initial, onSelect) {
  closePopup();

  let [hh, mm] = (initial || '09:00').split(':').map(x => parseInt(x));
  if (isNaN(hh)) hh = 9;
  if (isNaN(mm)) mm = 0;

  const overlay = document.createElement('div');
  overlay.className = 'popup-overlay';
  document.body.appendChild(overlay);
  activePopup = overlay;

  const render = () => {
    let hoursHTML = '';
    for (let h = 0; h < 24; h++) {
      hoursHTML += `<div class="time-item ${h === hh ? 'active' : ''}" data-h="${h}">${String(h).padStart(2,'0')}</div>`;
    }
    let minsHTML = '';
    for (let m = 0; m < 60; m += 5) {
      minsHTML += `<div class="time-item ${m === mm ? 'active' : ''}" data-m="${m}">${String(m).padStart(2,'0')}</div>`;
    }

    overlay.innerHTML = `
      <div class="popup time-popup">
        <div class="time-display">${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}</div>
        <div class="time-cols">
          <div>
            <div class="time-col-label">Часы</div>
            <div class="time-scroll" id="hoursScroll">${hoursHTML}</div>
          </div>
          <div>
            <div class="time-col-label">Минуты</div>
            <div class="time-scroll" id="minsScroll">${minsHTML}</div>
          </div>
        </div>
        <div class="time-quick">
          <button type="button" data-quick="08:00">08:00</button>
          <button type="button" data-quick="09:00">09:00</button>
          <button type="button" data-quick="12:00">12:00</button>
          <button type="button" data-quick="18:00">18:00</button>
          <button type="button" data-quick="21:00">21:00</button>
        </div>
        <div class="row" style="justify-content: space-between">
          <button type="button" class="btn ghost small" data-time-cancel>Отмена</button>
          <button type="button" class="btn small" data-time-ok>Готово</button>
        </div>
      </div>
    `;

    // центрируем активные элементы
    setTimeout(() => {
      const hs = document.getElementById('hoursScroll');
      const ms = document.getElementById('minsScroll');
      const activeH = hs?.querySelector('.active');
      const activeM = ms?.querySelector('.active');
      if (activeH && hs) hs.scrollTop = activeH.offsetTop - hs.clientHeight/2 + activeH.clientHeight/2;
      if (activeM && ms) ms.scrollTop = activeM.offsetTop - ms.clientHeight/2 + activeM.clientHeight/2;
    }, 30);
  };

  overlay.addEventListener('click', e => {
    if (e.target === overlay) { closePopup(); return; }

    const hItem = e.target.closest('[data-h]');
    if (hItem) {
      hh = parseInt(hItem.dataset.h);
      overlay.querySelectorAll('#hoursScroll .time-item').forEach(el => el.classList.toggle('active', parseInt(el.dataset.h) === hh));
      updateDisplay();
      return;
    }
    const mItem = e.target.closest('[data-m]');
    if (mItem) {
      mm = parseInt(mItem.dataset.m);
      overlay.querySelectorAll('#minsScroll .time-item').forEach(el => el.classList.toggle('active', parseInt(el.dataset.m) === mm));
      updateDisplay();
      return;
    }

    const quick = e.target.closest('[data-quick]');
    if (quick) {
      const [qh, qm] = quick.dataset.quick.split(':').map(Number);
      hh = qh; mm = qm;
      render();
      return;
    }

    if (e.target.closest('[data-time-ok]')) {
      onSelect(`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`);
      closePopup();
      return;
    }
    if (e.target.closest('[data-time-cancel]')) closePopup();
  });

  const updateDisplay = () => {
    const d = overlay.querySelector('.time-display');
    if (d) d.textContent = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  };

  render();
}

/* ============================ CUSTOM SELECT ============================ */

function openSelectPopup(title, options, selectedId, onSelect) {
  closePopup();
  const overlay = document.createElement('div');
  overlay.className = 'popup-overlay';
  document.body.appendChild(overlay);
  activePopup = overlay;

  const hasGroups = options.some(o => o.group);
  let html = `<div class="select-head">${escapeHtml(title)}</div>`;

  if (hasGroups) {
    const order = ['needs', 'debts', 'wants', 'savings'];
    order.forEach(g => {
      const items = options.filter(o => o.group === g);
      if (!items.length) return;
      html += `<div class="sel-group-label">${GROUPS[g].name}</div>`;
      html += items.map(o => `
        <button type="button" class="sel-item ${o.id === selectedId ? 'selected' : ''}" data-sel="${o.id}">
          <span class="sel-icon">${o.icon}</span>
          <span class="sel-name">${escapeHtml(o.name)}</span>
        </button>
      `).join('');
    });
  } else {
    html += options.map(o => `
      <button type="button" class="sel-item ${o.id === selectedId ? 'selected' : ''}" data-sel="${o.id}">
        <span class="sel-icon">${o.icon}</span>
        <span class="sel-name">${escapeHtml(o.name)}</span>
      </button>
    `).join('');
  }

  overlay.innerHTML = `<div class="popup select-popup">${html}</div>`;
  overlay.addEventListener('click', e => {
    if (e.target === overlay) { closePopup(); return; }
    const item = e.target.closest('[data-sel]');
    if (item) { onSelect(item.dataset.sel); closePopup(); }
  });
}

/* ============================ VIOLATIONS / ANALYTICS PER DAY ============================ */

/**
 * Возвращает объект с нарушениями дня:
 * { overDistribution: [...], unfinishedTasks: [...], planStatus: 'ok'|'bad'|null }
 */
function analyzeDay(iso) {
  const dayTx = state.transactions.filter(t => t.date === iso);
  const dayExpense = dayTx.filter(t => t.type === 'expense').reduce((s,t) => s + t.amount, 0);
  const dayIncome = dayTx.filter(t => t.type === 'income').reduce((s,t) => s + t.amount, 0);

  // Выход за распределение: считаем по дневной норме
  // Норма = (доход за месяц * pct / 100) / дней в месяце
  const monthIncome = state.transactions
    .filter(t => t.type === 'income' && t.date.slice(0,7) === iso.slice(0,7))
    .reduce((s,t) => s + t.amount, 0);

  const daysInMonth = new Date(parseInt(iso.slice(0,4)), parseInt(iso.slice(5,7)), 0).getDate();
  const overDistribution = [];

  if (monthIncome > 0) {
    const dayExpByGroup = { needs: 0, wants: 0, savings: 0, debts: 0 };
    dayTx.filter(t => t.type === 'expense').forEach(t => {
      const c = CATEGORIES.expense.find(x => x.id === t.category);
      if (c) dayExpByGroup[c.group] += t.amount;
    });

    Object.keys(GROUPS).forEach(g => {
      const pct = state.distribution[g] / 100;
      const dailyNorm = monthIncome * pct / daysInMonth;
      if (dayExpByGroup[g] > dailyNorm && dailyNorm > 0) {
        overDistribution.push({
          group: g,
          spent: dayExpByGroup[g],
          norm: dailyNorm,
          over: dayExpByGroup[g] - dailyNorm
        });
      }
    });
  }

  // Незавершённые задачи в планере
  const tasks = state.planner[iso] || [];
  const unfinishedTasks = tasks.filter(t => !t.done);

  // План-задачи — ищем планы, у которых истёк срок и не выполнен полностью
  // Здесь: если есть план с периодом, и день = конец периода, и прогресс <100 — фиксируем
  const brokenPlans = [];
  state.plans.forEach(p => {
    if (p.endDate && p.endDate === iso) {
      const pct = planPct(p);
      if (pct < 100) brokenPlans.push({ plan: p, pct });
    }
  });

  const hasBad = overDistribution.length > 0 || unfinishedTasks.length > 0 || brokenPlans.length > 0;
  const hasAny = dayTx.length > 0 || tasks.length > 0;

  return {
    dayTx, dayExpense, dayIncome,
    overDistribution,
    unfinishedTasks,
    brokenPlans,
    status: hasBad ? 'bad' : (hasAny ? 'ok' : null)
  };
}

function planPct(plan) {
  if (!plan.subtasks || !plan.subtasks.length) return 0;
  const done = plan.subtasks.filter(s => s.done).length;
  return Math.round(done / plan.subtasks.length * 100);
}

/* ============================ GOALS LOGIC ============================ */

/**
 * Вычисляет прогресс цели и прогноз даты.
 * Прогноз: используем среднее пополнение в день из истории
 * транзакций со category='savings' или 'invest' (за последние 3 мес).
 * Если истории нет — берём распределение: savings% от среднего месячного дохода.
 */
function goalStats(goal) {
  const saved = goal.saved || 0;
  const total = goal.amount;
  const pct = total > 0 ? Math.min(100, Math.round(saved / total * 100)) : 0;

  // 1. Средние пополнения в день за последние 3 месяца
  const now = new Date();
  const threeMonthsAgo = new Date(now.getFullYear(), now.getMonth() - 2, 1);
  const fromIso = fmtDateLocal(threeMonthsAgo);

  const savingsTx = state.transactions.filter(t =>
    t.type === 'expense' &&
    (t.category === 'savings' || t.category === 'invest') &&
    t.date >= fromIso
  );
  const totalSaved = savingsTx.reduce((s,t) => s + t.amount, 0);
  const daysSpan = Math.max(1, Math.round((now - threeMonthsAgo) / 86400000));
  let dailyRate = totalSaved / daysSpan;

  // 2. Если истории нет — прогноз от распределения
  if (dailyRate < 1) {
    // средний месячный доход за всё время
    const incomeByMonth = {};
    state.transactions.filter(t => t.type === 'income').forEach(t => {
      const k = t.date.slice(0,7);
      incomeByMonth[k] = (incomeByMonth[k] || 0) + t.amount;
    });
    const months = Object.keys(incomeByMonth);
    const avgMonthIncome = months.length
      ? Object.values(incomeByMonth).reduce((a,b) => a+b, 0) / months.length
      : 0;

    const savingsPct = state.distribution.savings / 100;
    dailyRate = (avgMonthIncome * savingsPct) / 30;
  }

  const remaining = Math.max(0, total - saved);
  let etaText = 'недостаточно данных';
  if (dailyRate > 0 && remaining > 0) {
    const daysLeft = Math.ceil(remaining / dailyRate);
    const eta = new Date();
    eta.setDate(eta.getDate() + daysLeft);
    etaText = fmtDateLocal(eta).split('-').reverse().join('.');
  } else if (remaining === 0) {
    etaText = 'цель достигнута 🎉';
  }

  return { saved, total, pct, remaining, dailyRate, etaText };
}

/**
 * Предлагаемое распределение под цель.
 * Учитывает долги: если долгов много — уменьшаем savings, увеличиваем debts.
 */
function suggestedDistributionForGoal(goal) {
  const base = { ...state.distribution };
  const totalDebt = state.debts.reduce((s,d) => s + Math.max(0, d.amount - (d.paid || 0)), 0);
  const goalAmount = goal.amount;
  const daysToGoal = goal.periodDays || 90;

  const neededPerMonth = goalAmount / (daysToGoal / 30);
  // средний месячный доход
  const incomeByMonth = {};
  state.transactions.filter(t => t.type === 'income').forEach(t => {
    const k = t.date.slice(0,7);
    incomeByMonth[k] = (incomeByMonth[k] || 0) + t.amount;
  });
  const months = Object.keys(incomeByMonth);
  const avgIncome = months.length
    ? Object.values(incomeByMonth).reduce((a,b) => a+b, 0) / months.length
    : 0;

  // Корректируем
  let suggested = { ...base };

  if (totalDebt > 0 && avgIncome > 0) {
    const debtShare = Math.min(45, Math.round(totalDebt / avgIncome * 100));
    const shift = Math.min(20, Math.round(debtShare / 2));
    suggested.debts = Math.min(50, base.debts + shift);
    suggested.wants = Math.max(5, base.wants - Math.round(shift / 2));
    suggested.savings = Math.max(5, base.savings - Math.ceil(shift / 2));
    const sum = suggested.needs + suggested.wants + suggested.savings + suggested.debts;
    if (sum !== 100) suggested.savings += 100 - sum;
  }

  // Проверка достижимости
  const monthlyToGoal = avgIncome * suggested.savings / 100;
  const monthsNeeded = monthlyToGoal > 0 ? goalAmount / monthlyToGoal : Infinity;

  return { suggested, avgIncome, monthsNeeded, neededPerMonth, totalDebt };
}

/* ============================ RENDER: ANALYTICS ============================ */

function buildDonut(items) {
  const total = items.reduce((s,i) => s + i.value, 0);
  if (!total) return 'var(--panel2)';
  let acc = 0;
  const stops = items.map(i => {
    const start = acc / total * 100;
    acc += i.value;
    const end = acc / total * 100;
    return `${i.color} ${start}% ${end}%`;
  });
  return `conic-gradient(${stops.join(',')})`;
}

function buildDailyChart(tx) {
  const [from, to] = getRange();
  const days = daysBetween(from, to);
  const mode = days > 62 ? 'month' : 'day';
  const map = {};

  if (mode === 'day') {
    for (let i = 0; i < days; i++) {
      const d = new Date(from); d.setDate(d.getDate() + i);
      const k = fmtDateLocal(d);
      map[k] = { inc: 0, exp: 0, label: `${d.getDate()}.${String(d.getMonth()+1).padStart(2,'0')}` };
    }
  } else {
    const start = new Date(from);
    const end = new Date(to);
    const cur = new Date(start.getFullYear(), start.getMonth(), 1);
    while (cur <= end) {
      const k = `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}`;
      map[k] = { inc: 0, exp: 0, label: `${cur.getMonth()+1}.${String(cur.getFullYear()).slice(2)}` };
      cur.setMonth(cur.getMonth() + 1);
    }
  }

  tx.forEach(t => {
    const k = mode === 'day' ? t.date : t.date.slice(0, 7);
    if (!map[k]) return;
    if (t.type === 'income') map[k].inc += t.amount;
    else map[k].exp += t.amount;
  });

  const entries = Object.entries(map);
  const maxVal = Math.max(1, ...entries.map(([,v]) => Math.max(v.inc, v.exp)));
  const bars = entries.map(([k, v]) => ({
    label: v.label,
    inc: v.inc, exp: v.exp,
    incH: v.inc / maxVal * 100,
    expH: v.exp / maxVal * 100
  }));

  return { mode, bars };
}

              <div>
                <div class="v">${money(income)}</div>
                <div class="l">всего доходов</div>
              </div>
            </div>
          </div>
          <div class="legend">
            ${incList.map(([id, val], i) => {
              const c = catById('income', id);

              return `<div class="legend-item">
                <span class="legend-dot" style="background:${palette[i % palette.length]}"></span>

/* ============================ RENDER: DISTRIBUTION ============================ */

function calcDistribution(baseIncome) {
  const base = ui.distBase !== null ? ui.distBase : baseIncome;
  const d = state.distribution;
  const out = { base };
  ['needs','wants','savings','debts'].forEach(g => {
    out[g] = { pct: d[g], plan: base * d[g] / 100 };
  });
  return out;
}

function renderDistribution() {
  const tx = filteredTx();
  const periodIncome = tx.filter(t => t.type === 'income').reduce((s,t) => s + t.amount, 0);
  const dist = calcDistribution(periodIncome);
  const totalPct = state.distribution.needs + state.distribution.wants + state.distribution.savings + state.distribution.debts;

  const actual = { needs: 0, wants: 0, savings: 0, debts: 0 };
  tx.filter(t => t.type === 'expense').forEach(t => {
    const c = CATEGORIES.expense.find(x => x.id === t.category);
    if (c) actual[c.group] += t.amount;
  });

  const totalDebt = state.debts.reduce((s,d) => s + Math.max(0, d.amount - (d.paid || 0)), 0);

  return `
  <div class="card">
    <h3>Доход для распределения</h3>
    <div class="row">
      <input type="number" id="distBase" value="${Math.round(dist.base)}" style="max-width:220px" step="100" inputmode="numeric" placeholder="0">
      <button type="button" class="btn ghost small" id="distAuto">Взять доход за период (${money(periodIncome)})</button>
    </div>
    <div class="muted mt" style="font-size:13px">
      ${ui.distBase === null ? 'Значение берётся автоматически из доходов за выбранный период.' : 'Используется ручное значение.'}
      ${totalDebt > 0 ? `<br>💡 Активных долгов на <b style="color:var(--red)">${money(totalDebt)}</b> — распределение учтёт это.` : ''}
    </div>
  </div>

  <div class="card mt">
    <div class="card-head-row">
      <h3>Проценты распределения</h3>
      <span class="pct-badge ${totalPct === 100 ? 'ok' : 'warn'}">Сумма: ${totalPct}%</span>
    </div>
    <div class="progress-total">
      ${Object.keys(GROUPS).map(g => {
        const p = state.distribution[g];
        return `<div style="width:${p}%;background:${GROUPS[g].color}"></div>`;
      }).join('')}
    </div>

    <div class="grid cards-3 mt">
      ${Object.keys(GROUPS).map(g => {
        const pct = state.distribution[g];
        const plan = dist.base * pct / 100;
        const fact = actual[g];
        const diff = fact - plan;
        return `
        <div class="dist-card card" style="background:var(--panel2);border-color:${GROUPS[g].color}33">
          <div class="stripe" style="background:${GROUPS[g].color}"></div>
          <div class="dist-name" style="color:${GROUPS[g].color}">${GROUPS[g].name}</div>
          <div class="dist-desc">${GROUPS[g].desc}</div>

          <div class="pct-input">
            <input type="number" min="0" max="100" value="${pct}" data-dist-input="${g}" inputmode="numeric">
            <span class="muted">%</span>
          </div>

          <div class="amount" style="color:${GROUPS[g].color}">${money(plan)}</div>
          <div class="actual">
            Потрачено: <b>${money(fact)}</b><br>
            <span style="color:${diff > 0 ? 'var(--red)' : 'var(--green)'}">
              ${diff > 0 ? '▲ перерасход ' + money(diff) : '▼ остаток ' + money(-diff)}
            </span>
          </div>

          <div class="bar-bg" style="margin-top:12px">
            <div class="bar-fill" style="width:${plan > 0 ? Math.min(100, fact/plan*100) : 0}%;background:${GROUPS[g].color}"></div>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>

  <div class="card mt">
    <h3>Пресеты</h3>
    <div class="row">
      <button type="button" class="btn ghost small" id="preset1">40 / 20 / 20 / 20</button>
      <button type="button" class="btn ghost small" id="preset2">50 / 20 / 20 / 10</button>
      <button type="button" class="btn ghost small" id="preset3">35 / 15 / 30 / 20</button>
    </div>
  </div>
  `;
}

/* ============================ RENDER: PLANS ============================ */

function renderPlans() {

function renderPlanCard(plan) {

  return `

      <div style="flex:1;min-width:0">
        <div class="plan-title">${escapeHtml(plan.title)}</div>

      <div class="plan-pct" style="color:${isDone ? 'var(--green)' : 'var(--accent)'}">${pct}%</div>

    </div>
    <div class="plan-bar">
      <div class="plan-bar-fill" style="width:${pct}%;background:${isDone ? 'var(--green)' : 'var(--accent)'}"></div>

        </div>

    </div>
    <form class="plan-add-form" data-plan-add="${plan.id}">

/* ============================ RENDER: GOALS ============================ */

function goalCardHTML(goal, withControls = false) {

  return `
  <div class="goal-card">
    <div class="goal-head">
      <div class="goal-emoji">🎯</div>
      <div class="goal-info">
        <div class="goal-title">${escapeHtml(goal.title)}</div>
        <div class="goal-period">${goal.periodDays ? 'срок ' + goal.periodDays + ' дн.' : ''} ${goal.createdAt ? '· создано ' + fmtDateHuman(goal.createdAt) : ''}</div>
        <div class="goal-amount">${money(goal.amount)}</div>
      </div>
      ${withControls ? `<button type="button" class="goal-del" data-goal-del="${goal.id}" title="Удалить">×</button>` : ''}
    </div>

    <div class="goal-progress">
      <div class="goal-progress-fill" style="width:${st.pct}%;background:${pctColor}"></div>
    </div>
    <div class="goal-stats">
      <span>Накоплено <b>${money(st.saved)}</b> из <b>${money(st.total)}</b></span>
      <span>Выполнение <b style="color:${pctColor}">${st.pct}%</b></span>

    <div class="goal-stats" style="margin-top:6px">
      <span>Осталось <b>${money(st.remaining)}</b></span>
      <span>Темп <b>${money(st.dailyRate)}</b>/день</span>
    </div>

    <div class="goal-tip">
      📅 Прогноз достижения: <b>${st.etaText}</b>
      ${sug ? `<br>💡 Рекомендуется: обязательное ${sug.suggested.needs}% · развлечения ${sug.suggested.wants}% · сбережения ${sug.suggested.savings}% · долги ${sug.suggested.debts}%` : ''}
      ${sug && sug.totalDebt > 0 ? `<br>⚠️ Учтены долги: ${money(sug.totalDebt)} — приоритет закрытия.` : ''}
    </div>

    ${withControls ? `
    <form class="plan-add-form" data-goal-add="${goal.id}" style="margin-top:12px">
      <input type="number" step="100" min="0" inputmode="numeric" placeholder="Сумма пополнения, ${state.currency}">
      <button type="submit" class="btn small">Пополнить</button>
